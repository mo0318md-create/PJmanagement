  /* ================================================================
   * ドラッグ（マウス・ペン・タッチ共通）
   *   マウス・ペン … 押したまま動かすと始まる
   *   タッチ       … 長押ししてから動かす。すぐ指を動かしたときは画面のスクロールとして扱う
   * 使う側は dragOn(選択子, { start, move, end, cancel, scroller }) で登録する。
   *   start(pt, el, pointerType) … 始めてよければ true を返す
   *   move(pt) / end(pt) / cancel()
   *   scroller(el) … 端に寄せたときに自動で横スクロールする入れ物（無ければ null）
   * ================================================================ */
  var DRAG_LONG_PRESS_MS = 350;
  var DRAG_SLOP_PX = 6;
  var dragDefs = [];
  var dg = null;            // 進行中のドラッグ { def, el, sx, sy, x, y, started, type, timer, scroller, raf }
  var dragClickBlockUntil = 0;

  function dragOn(selector, def) { def.selector = selector; dragDefs.push(def); }

  function dragFind(target) {
    for (var i = 0; i < dragDefs.length; i++) {
      var el = target.closest && target.closest(dragDefs[i].selector);
      if (el) return { def: dragDefs[i], el: el };
    }
    return null;
  }

  function dragBegin() {
    // 起点は「押した位置」。つかんだ場所（端か中ほどか）と、動かした量の基準になる
    var ok = dg.def.start({ x: dg.sx, y: dg.sy }, dg.el, dg.type);
    if (!ok) { dg = null; return false; }
    dg.started = true;
    dg.scroller = dg.def.scroller ? dg.def.scroller(dg.el) : null;
    document.body.classList.add('is-dragging');
    if (dg.type === 'touch' && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    dragAutoScroll();
    return true;
  }

  function dragMove(x, y) {
    dg.x = x; dg.y = y;
    dg.def.move({ x: x, y: y });
  }

  function dragFinish(cancelled) {
    var d = dg;
    dg = null;
    if (!d) return;
    clearTimeout(d.timer);
    if (d.raf) cancelAnimationFrame(d.raf);
    document.body.classList.remove('is-dragging');
    if (!d.started) return;
    // 離した直後にブラウザが出すクリック（編集が開く等）だけを無視する。
    // マウスは pointerup の直後に続けて出るので短い時間で足りる（長くすると次の操作まで消してしまう）
    dragClickBlockUntil = Date.now() + 50;
    if (cancelled) d.def.cancel(); else d.def.end({ x: d.x, y: d.y });
  }

  /** 入れ物の端や画面の上下に寄せている間、そちらへ少しずつスクロールする */
  function dragAutoScroll() {
    if (!dg || !dg.started) return;
    var EDGE = 36, STEP = 12, moved = false;
    var sc = dg.scroller;
    if (sc) {
      var r = sc.getBoundingClientRect();
      if (dg.x < r.left + EDGE && sc.scrollLeft > 0) { sc.scrollLeft -= STEP; moved = true; }
      else if (dg.x > r.right - EDGE && sc.scrollLeft + sc.clientWidth < sc.scrollWidth) { sc.scrollLeft += STEP; moved = true; }
    }
    var bottomBar = window.innerWidth <= 900 ? 72 : 0;
    if (dg.y < EDGE + 60) { window.scrollBy(0, -STEP); moved = true; }
    else if (dg.y > window.innerHeight - EDGE - bottomBar) { window.scrollBy(0, STEP); moved = true; }
    if (moved) dg.def.move({ x: dg.x, y: dg.y });
    dg.raf = requestAnimationFrame(dragAutoScroll);
  }

  // ---- マウス・ペン（Pointer Events）----
  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch' || e.button !== 0 || dg) return;
    var f = dragFind(e.target);
    if (!f) return;
    dg = { def: f.def, el: f.el, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, started: false, type: e.pointerType };
  });
  document.addEventListener('pointermove', function (e) {
    if (!dg || dg.type === 'touch') return;
    if (!dg.started) {
      if (Math.abs(e.clientX - dg.sx) + Math.abs(e.clientY - dg.sy) < DRAG_SLOP_PX) return;
      dg.x = e.clientX; dg.y = e.clientY;
      if (!dragBegin()) return;
    }
    e.preventDefault();
    dragMove(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', function (e) {
    if (!dg || dg.type === 'touch') return;
    if (dg.started) { dg.x = e.clientX; dg.y = e.clientY; }
    dragFinish(false);
  });
  document.addEventListener('pointercancel', function (e) {
    if (dg && dg.type !== 'touch') dragFinish(true);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && dg && dg.started) dragFinish(true);
  });

  // ---- タッチ（長押しで開始）----
  document.addEventListener('touchstart', function (e) {
    if (dg || e.touches.length !== 1) { if (dg && !dg.started) dragFinish(true); return; }
    var f = dragFind(e.target);
    if (!f) return;
    var t = e.touches[0];
    dg = { def: f.def, el: f.el, sx: t.clientX, sy: t.clientY, x: t.clientX, y: t.clientY, started: false, type: 'touch' };
    f.el.classList.add('press');
    dg.timer = setTimeout(function () {
      if (dg && !dg.started) { dg.el.classList.remove('press'); dragBegin(); }
    }, DRAG_LONG_PRESS_MS);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (!dg || dg.type !== 'touch') return;
    var t = e.touches[0];
    if (!dg.started) {
      // 長押しの前に指が動いた＝スクロール。ドラッグにはしない
      if (Math.abs(t.clientX - dg.sx) + Math.abs(t.clientY - dg.sy) > DRAG_SLOP_PX * 2) {
        dg.el.classList.remove('press');
        clearTimeout(dg.timer); dg = null;
      }
      return;
    }
    e.preventDefault();   // ドラッグ中は画面をスクロールさせない
    dragMove(t.clientX, t.clientY);
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (!dg || dg.type !== 'touch') return;
    dg.el.classList.remove('press');
    if (dg.started) e.preventDefault();   // 離したときのタップ（編集が開く等）を起こさない
    dragFinish(false);
  }, { passive: false });
  document.addEventListener('touchcancel', function () {
    if (dg && dg.type === 'touch') { dg.el.classList.remove('press'); dragFinish(true); }
  });

  // 長押しで出るメニューやブラウザ標準のドラッグと取り合わないようにする
  document.addEventListener('contextmenu', function (e) {
    if (dg && dg.type === 'touch') e.preventDefault();
  });
  document.addEventListener('dragstart', function (e) { if (dragFind(e.target)) e.preventDefault(); });
  document.addEventListener('click', function (e) {
    if (Date.now() < dragClickBlockUntil && !(e.target.closest && e.target.closest('#toast'))) {
      e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault();
    }
  }, true);

  /* ================================================================
   * ガントのバーで日程を変える
   *   バーの中ほどを動かす … 開始日と終了日を同じ日数だけずらす
   *   左端／右端を動かす   … 開始日／終了日だけを変える（期間は1日より短くならない）
   * 対象はタスクのバー（②⑥⑫⑬）と、②のプロジェクトの帯。離したときに保存し、「元に戻す」で取り消せる。
   * ================================================================ */
  var gd = null;   // { bar, kind, id, mode, s0, e0, s, e, min, span, dayPx }

  function gdTip(show) {
    var tip = $('gtip');
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'gtip'; tip.className = 'gtip'; tip.setAttribute('role', 'status');
      document.body.appendChild(tip);
    }
    tip.hidden = !show;
    return tip;
  }

  function gdPaint(pt) {
    var pct = function (iso) { return (H.diffDays(gd.min, iso) / gd.span) * 100; };
    gd.bar.style.left = pct(gd.s).toFixed(3) + '%';
    gd.bar.style.width = Math.max(0.6, ((H.diffDays(gd.s, gd.e) + 1) / gd.span) * 100).toFixed(3) + '%';
    var dS = H.diffDays(gd.s0, gd.s), dE = H.diffDays(gd.e0, gd.e);
    var sign = function (n) { return (n > 0 ? '+' : '') + n + '日'; };
    var what = gd.mode === 'move' ? (dS ? '全体を ' + sign(dS) : '動かしていません')
      : gd.mode === 'start' ? (dS ? '開始日を ' + sign(dS) : '開始日そのまま')
      : (dE ? '終了日を ' + sign(dE) : '終了日そのまま');
    var tip = gdTip(true);
    tip.innerHTML = '<b>' + esc(H.formatDate(gd.s)) + ' 〜 ' + esc(H.formatDate(gd.e)) + '</b>' +
      '<span>' + H.durationDays(gd.s, gd.e) + '日間 ・ ' + esc(what) + '</span>';
    var up = gd.type === 'touch' ? 76 : 44;
    var x = Math.min(Math.max(pt.x, 110), window.innerWidth - 110);
    tip.style.left = x + 'px';
    tip.style.top = Math.max(pt.y - up, 8) + 'px';
  }

  dragOn('[data-gbar]', {
    scroller: function (el) { return el.closest('.gantt-scroll'); },
    start: function (pt, bar, type) {
      var g = bar.closest('.gantt');
      var track = bar.parentElement;
      var parts = bar.getAttribute('data-gbar').split(':');
      var span = Number(g.getAttribute('data-span'));
      var r = bar.getBoundingClientRect();
      // どこをつかんだかで「ずらす／開始日／終了日」を決める。タッチは指が太いので端の幅を広く取る
      var edge = Math.min(type === 'touch' ? 18 : 8, r.width / 3);
      var mode = pt.x <= r.left + edge ? 'start' : (pt.x >= r.right - edge ? 'end' : 'move');
      var s = bar.getAttribute('data-s'), e = bar.getAttribute('data-e');
      var sc = bar.closest('.gantt-scroll');
      gd = { bar: bar, kind: parts[0], id: parts.slice(1).join(':'), mode: mode, type: type,
             s0: s, e0: e, s: s, e: e, x0: pt.x, min: g.getAttribute('data-min'), span: span,
             dayPx: track.clientWidth / span, sc: sc, scroll0: sc ? sc.scrollLeft : 0 };
      bar.classList.add('dragging', 'mode-' + mode);
      gdPaint(pt);
      return true;
    },
    move: function (pt) {
      // 自動スクロールしたぶんも足す（バーの位置は中身の座標、指の位置は画面の座標のため）
      var dx = pt.x - gd.x0 + (gd.sc ? gd.sc.scrollLeft - gd.scroll0 : 0);
      var d = Math.round(dx / gd.dayPx);
      if (gd.mode === 'move') { gd.s = H.addDays(gd.s0, d); gd.e = H.addDays(gd.e0, d); }
      else if (gd.mode === 'start') { gd.s = H.addDays(gd.s0, d); if (gd.s > gd.e0) gd.s = gd.e0; gd.e = gd.e0; }
      else { gd.e = H.addDays(gd.e0, d); if (gd.e < gd.s0) gd.e = gd.s0; gd.s = gd.s0; }
      gdPaint(pt);
    },
    end: function () {
      var d = gd; gd = null;
      gdTip(false);
      d.bar.classList.remove('dragging', 'mode-' + d.mode);
      if (d.s === d.s0 && d.e === d.e0) { render(); return; }
      if (d.kind === 'item') {
        quickSave(d.id, { start_date: d.s, end_date: d.e }, {
          msg: '日程を ' + H.formatDate(d.s) + ' 〜 ' + H.formatDate(d.e) + ' にしました',
          undo: { start_date: d.s0, end_date: d.e0 }
        });
      } else {
        saveProjectDates(d.id, d.s, d.e, d.s0, d.e0);
      }
    },
    cancel: function () {
      var d = gd; gd = null;
      gdTip(false);
      if (d) d.bar.classList.remove('dragging', 'mode-' + d.mode);
      render();
    }
  });

  /** プロジェクトの期間だけを変えて保存する（②の帯のドラッグ）。ほかの設定は今の値のまま送る */
  function saveProjectDates(pid, s, e, s0, e0, isUndo) {
    var p = project(pid);
    if (!p) return;
    p.start_date = s; p.end_date = e;
    render();
    runServer('saveProject', {
      project_id: p.project_id, updated_at: p.updated_at,
      name: p.name, description: p.description || '', key: p.key,
      owner_user_id: p.owner_user_id, status: p.status,
      start_date: s, end_date: e,
      field_defs: p.field_defs, custom_fields: p.custom_fields
    }).then(function (r) {
      p.updated_at = r.updated_at;
      if (r.field_defs) p.field_defs = r.field_defs;
      if (r.custom_fields) p.custom_fields = r.custom_fields;
      toast(isUndo ? '元に戻しました' : '「' + p.name + '」の期間を ' + H.formatDate(s) + ' 〜 ' + H.formatDate(e) + ' にしました', false,
        isUndo ? null : { label: '元に戻す', fn: function () { saveProjectDates(pid, s0, e0, s, e, true); } });
      refreshSummarySoon();
    }).catch(function (err) {
      p.start_date = s0; p.end_date = e0;
      render();
      fail(err);
    });
  }

  /* ================================================================
   * ④ ボード：カードを別の列へ動かすとステータスが変わる（F-3-15）
   * マウスは押して動かす、タッチは長押ししてから動かす。カードをタップ／クリックすると編集が開く。
   * ================================================================ */
  var bd = null;   // { card, id, ghost, dx, dy, col }

  dragOn('[data-drag]', {
    scroller: function (el) { return el.closest('.board-wrap'); },
    start: function (pt, card) {
      var r = card.getBoundingClientRect();
      var ghost = card.cloneNode(true);
      ghost.removeAttribute('data-drag'); ghost.removeAttribute('data-edit');
      ghost.className = 'tcard tcard-ghost';
      ghost.style.width = r.width + 'px';
      document.body.appendChild(ghost);
      bd = { card: card, id: card.getAttribute('data-drag'), ghost: ghost, dx: pt.x - r.left, dy: pt.y - r.top, col: null };
      card.classList.add('dragging');
      this.move(pt);
      return true;
    },
    move: function (pt) {
      bd.ghost.style.transform = 'translate(' + (pt.x - bd.dx) + 'px,' + (pt.y - bd.dy) + 'px) rotate(1.5deg)';
      var under = document.elementFromPoint(pt.x, pt.y);
      var col = under && under.closest ? under.closest('[data-dropcol]') : null;
      if (col !== bd.col) {
        if (bd.col) bd.col.classList.remove('over');
        if (col) col.classList.add('over');
        bd.col = col;
      }
    },
    end: function () {
      var b = bd; bd = null;
      b.ghost.remove();
      b.card.classList.remove('dragging');
      if (b.col) b.col.classList.remove('over');
      var it = itemById(b.id);
      if (!b.col || !it) return;
      var status = b.col.getAttribute('data-dropcol');
      if (it.status === status) return;
      quickSave(b.id, { status: status }, {
        msg: '「' + it.name + '」を ' + H.STATUS_LABEL[status] + ' にしました',
        undo: { status: it.status, progress_rate: it.progress_rate }
      });
    },
    cancel: function () {
      var b = bd; bd = null;
      if (!b) return;
      b.ghost.remove();
      b.card.classList.remove('dragging');
      if (b.col) b.col.classList.remove('over');
    }
  });

  /** google.script.run を Promise で使う */
  function runServer(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      r[fn].apply(r, args);
    });
  }

  /** 保存のあと、一覧の集計（状態・進捗）を少し遅らせて1回だけ取り直す */
  var summaryTimer = null;
  function refreshSummarySoon() {
    clearTimeout(summaryTimer);
    summaryTimer = setTimeout(function () {
      runServer('getBootstrap').then(function (d) {
        d.summary.forEach(function (x) { S.summary[x.project_id] = x; });
        if (S.view === 'projects') render();
      }).catch(function () {});
    }, 800);
  }

  /**
   * タスクの一部（ステータス・進捗率・開始日・終了日）だけを変えて保存する（F-4-4、ボード、ガント）。
   * 画面は先に変えて、保存は裏で行う。同じタスクへの保存は順番に送る（更新日時の食い違いを防ぐ）。
   * 失敗したら、サーバーの内容を読み直して画面を正しい状態に戻す。
   * opts: { msg: 保存後に出す文, undo: 取り消すときに戻す値 }
   */
  var saveChains = {}, saveSeq = {};
  function quickSave(itemId, patch, opts) {
    opts = opts || {};
    var it = itemById(itemId);
    if (!it) return;
    ['status', 'progress_rate', 'start_date', 'end_date'].forEach(function (k) {
      if (patch[k] !== undefined) it[k] = patch[k];
    });
    if (it.status === 'done') it.progress_rate = 100;
    render();

    var mySeq = saveSeq[itemId] = (saveSeq[itemId] || 0) + 1;
    saveChains[itemId] = (saveChains[itemId] || Promise.resolve()).then(function () {
      // あとから同じタスクの保存が積まれていれば、そちらが最新の内容を送るので、ここは送らない
      if (mySeq !== saveSeq[itemId]) return;
      return runServer('saveItem', {
        item_id: it.item_id, updated_at: it.updated_at,
        name: it.name, description: it.description || '',
        item_type: it.item_type, assignee_user_id: it.assignee_user_id,
        status: it.status, start_date: it.start_date, end_date: it.end_date,
        progress_rate: it.progress_rate
      }).then(function (r) {
        it.updated_at = r.updated_at;
        toast(opts.msg || '保存しました', false, opts.undo ? {
          label: '元に戻す',
          fn: function () { quickSave(itemId, opts.undo, { msg: '元に戻しました' }); }
        } : null);
        refreshSummarySoon();
      });
    }).catch(function (err) {
      fail(err);
      loadItems();
    });
  }

  /* ============ 設定項目（1行 = 項目名・型・値） ============
   * テンプレートからコピーした行は名前と型が決まっていて、値だけ入れる。
   * 自分で足した行は、名前・型（選択肢の型なら選択肢も）・値を決める。
   * 定義は projects.field_defs、値は projects.custom_fields に入る。
   */
  var FIELD_TYPE_LABEL = { text: '文字', number: '数値', date: '日付', select: '選択肢', checkbox: 'はい／いいえ' };
  var FIELD_TYPE_ORDER = ['text', 'number', 'date', 'select', 'checkbox'];
  var fe = {};   // prefix -> { box, rows: [{ key, label, type, options, required, source, value }] }

  function feNewKey() { return 'f_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function splitOptions(s) {
    var out = [];
    String(s || '').split(/[,、]/).forEach(function (o) {
      o = o.trim();
      if (o && out.indexOf(o) < 0) out.push(o);
    });
    return out;
  }

  function copyDef(d, value) {
    return { key: d.key, label: d.label, type: d.type || 'text', options: (d.options || []).slice(),
             required: !!d.required, source: d.source || 'project', value: value };
  }

  function tplDefsFromFields(fields) {
    return (fields || []).map(function (f) {
      return { key: f.field_key, label: f.label, type: f.type, options: f.options || [], required: !!f.required, source: 'template' };
    });
  }

  function feSetup(prefix, boxId, defs, values) {
    values = values || {};
    fe[prefix] = { box: boxId, rows: (defs || []).map(function (d) { return copyDef(d, values[d.key]); }) };
    feDraw(prefix);
  }

  /** テンプレートを選び直したとき。テンプレート由来の行だけ入れ替え、自分で足した行と入力済みの値は残す */
  function feReplaceTemplateRows(prefix, tplDefs) {
    feSync(prefix);
    var st = fe[prefix];
    var old = {};
    st.rows.forEach(function (r) { old[r.key] = r.value; });
    st.rows = tplDefs.map(function (d) { return copyDef(d, old[d.key]); })
      .concat(st.rows.filter(function (r) { return r.source !== 'template'; }));
    feDraw(prefix);
  }

  /** 型を変えたときに、今の値を新しい型で通る形にする（通らなければ空にする） */
  function feConvert(v, type, options) {
    if (type === 'checkbox') return v === true || v === 'true' || v === 'はい';
    if (v === true) v = 'はい';
    if (v === false) v = '';
    var s = v === undefined || v === null ? '' : String(v).trim();
    if (type === 'number') { var n = Number(s.replace(/,/g, '')); return s !== '' && !isNaN(n) ? n : ''; }
    if (type === 'date') return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
    if (type === 'select') return options.indexOf(s) >= 0 ? s : '';
    return s;
  }

  function feValueInput(prefix, i, r) {
    var id = prefix + '-fv-' + i;
    var aria = ' aria-label="' + esc((r.label || '項目') + 'の値') + '"';
    var v = r.value;
    if (r.type === 'checkbox') {
      return '<label class="fe-check"><input type="checkbox" id="' + id + '"' + (v === true ? ' checked' : '') + aria + '> はい</label>';
    }
    if (r.type === 'select') {
      if (!r.options.length) return '<select id="' + id + '" disabled' + aria + '><option>選択肢がありません</option></select>';
      return '<select id="' + id + '"' + aria + '><option value="">（未選択）</option>' +
        r.options.map(function (o) {
          return '<option' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
    }
    var t = r.type === 'number' ? 'number' : (r.type === 'date' ? 'date' : 'text');
    return '<input id="' + id + '" type="' + t + '"' + (t === 'number' ? ' step="any" inputmode="decimal"' : '') +
      ' value="' + esc(v === undefined || v === null ? '' : v) + '"' + aria + '>';
  }

  function feRow(prefix, i, r) {
    var isTpl = r.source === 'template';
    var name = isTpl
      ? '<div class="fe-name"><span class="fe-fixed">' + esc(r.label) + '</span>' +
          (r.required ? '<span class="fe-tag req">必須</span>' : '') +
          '<span class="fe-tag">テンプレート</span></div>'
      : '<input id="' + prefix + '-fl-' + i + '" type="text" maxlength="40" value="' + esc(r.label) + '"' +
          ' placeholder="項目名（例：発注番号）" aria-label="項目名">';
    var type = isTpl
      ? '<span class="fe-fixed fe-typename">' + FIELD_TYPE_LABEL[r.type] + '</span>'
      : '<select id="' + prefix + '-ft-' + i + '" data-fetype="' + prefix + ':' + i + '" aria-label="型">' +
          optionList(FIELD_TYPE_ORDER.map(function (k) { return [k, FIELD_TYPE_LABEL[k]]; }), r.type) + '</select>';
    var del = isTpl
      ? '<span></span>'
      : '<button type="button" class="btn sm fe-del" data-fedel="' + prefix + ':' + i + '" aria-label="この項目を消す" title="この項目を消す">×</button>';
    var opts = (!isTpl && r.type === 'select')
      ? '<div class="fe-opts"><label class="fe-opts-lbl" for="' + prefix + '-fo-' + i + '">選択肢</label>' +
          '<input id="' + prefix + '-fo-' + i + '" data-feopts="' + prefix + ':' + i + '" type="text"' +
          ' value="' + esc(r.options.join(', ')) + '" placeholder="カンマ区切り（例：新規, 継続, 保守）"></div>'
      : '';
    return '<div class="fe-row' + (isTpl ? ' tpl' : '') + '">' + name + type +
      '<div class="fe-val">' + feValueInput(prefix, i, r) + '</div>' + del + opts + '</div>';
  }

  function feDraw(prefix) {
    var st = fe[prefix];
    var box = st ? $(st.box) : null;
    if (!box) return;
    var rows = st.rows;
    box.innerHTML = '<div class="fe">' +
      '<div class="fe-title"><h3>設定項目</h3><span class="faint">' + rows.length + ' 件</span></div>' +
      (rows.length
        ? '<div class="fe-row fe-colhead" aria-hidden="true"><span>項目名</span><span>型</span><span>値</span><span></span></div>' +
          rows.map(function (r, i) { return feRow(prefix, i, r); }).join('')
        : '<div class="fe-empty">項目はありません</div>') +
      '<button type="button" class="btn sm" data-feadd="' + prefix + '">＋ 項目を追加</button>' +
    '</div>';
  }

  /** 画面の入力を行の控えに書き戻す（描き直す前に呼ぶ。入力中の値を失わないため） */
  function feSync(prefix) {
    var st = fe[prefix];
    if (!st) return;
    st.rows.forEach(function (r, i) {
      if (r.source !== 'template') {
        var l = $(prefix + '-fl-' + i); if (l) r.label = l.value;
        var o = $(prefix + '-fo-' + i); if (o) r.options = splitOptions(o.value);
      }
      var el = $(prefix + '-fv-' + i);
      if (!el) return;
      if (r.type === 'checkbox') r.value = el.checked;
      else r.value = el.disabled ? '' : el.value;
    });
  }

  /**
   * 保存に送る形にする。名前の無い行は、値も空なら捨てる。
   * 直してほしい行があれば、最初の1つを error / errorId で返す（その欄に印を付けて移る）。
   */
  function feCollect(prefix) {
    feSync(prefix);
    var defs = [], values = {}, error = '', errorId = '', seen = {};
    function bad(msg, id) { if (!error) { error = msg; errorId = id; } }
    ((fe[prefix] || {}).rows || []).forEach(function (r, i) {
      var label = String(r.label || '').trim();
      var own = r.source !== 'template';
      if (own && !label) {
        var has = r.value !== '' && r.value !== false && r.value !== undefined && r.value !== null;
        if (has) bad('項目名が空の行があります。名前を入れるか、×で消してください', prefix + '-fl-' + i);
        return;
      }
      if (seen[label.toLowerCase()]) bad('項目名「' + label + '」が2つあります。別の名前にしてください', prefix + '-fl-' + i);
      seen[label.toLowerCase()] = true;
      if (own && r.type === 'select' && !r.options.length) {
        bad('「' + label + '」は選択肢の型です。選択肢を入れてください', prefix + '-fo-' + i);
      }
      defs.push({ key: r.key, label: label, type: r.type, options: r.options, required: r.required, source: r.source });
      values[r.key] = r.value;
    });
    return { defs: defs, values: values, error: error, errorId: errorId };
  }

  /** feCollect の結果に問題があれば知らせて、その欄へ移る。問題が無ければ true */
  function feCheck(fc) {
    if (!fc.error) return true;
    toast(fc.error, true);
    var el = $(fc.errorId);
    if (el) {
      el.classList.add('fe-bad');
      el.setAttribute('aria-invalid', 'true');
      el.focus();
      el.addEventListener('input', function () { el.classList.remove('fe-bad'); el.removeAttribute('aria-invalid'); }, { once: true });
    }
    return false;
  }

  function feFocus(id) { var el = $(id); if (el) el.focus(); }

  document.addEventListener('click', function (e) {
    var add = e.target.closest('[data-feadd]');
    if (add) {
      var pre = add.getAttribute('data-feadd');
      feSync(pre);
      fe[pre].rows.push({ key: feNewKey(), label: '', type: 'text', options: [], required: false, source: 'project', value: '' });
      feDraw(pre);
      feFocus(pre + '-fl-' + (fe[pre].rows.length - 1));
      return;
    }
    var del = e.target.closest('[data-fedel]');
    if (del) {
      var parts = del.getAttribute('data-fedel').split(':');
      feSync(parts[0]);
      fe[parts[0]].rows.splice(Number(parts[1]), 1);
      feDraw(parts[0]);
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target.getAttribute && e.target.getAttribute('data-fetype');
    if (t) {
      var p = t.split(':'), pre = p[0], i = Number(p[1]);
      feSync(pre);                         // 値は変える前の型で読む
      var r = fe[pre].rows[i];
      var nextType = e.target.value;
      // 文字で入れていた値を選択肢に切り替えたら、その値を最初の選択肢にする
      if (nextType === 'select' && !r.options.length && r.value !== '' && r.value !== undefined && r.value !== null && r.value !== true && r.value !== false) {
        r.options = [String(r.value).trim()];
      }
      r.type = nextType;
      r.value = feConvert(r.value, r.type, r.options);
      feDraw(pre);
      feFocus(pre + (r.type === 'select' ? '-fo-' : '-fv-') + i);
      return;
    }
    var o = e.target.getAttribute && e.target.getAttribute('data-feopts');
    if (o) {
      var q = o.split(':'), pre2 = q[0], j = Number(q[1]);
      feSync(pre2);
      var r2 = fe[pre2].rows[j];
      r2.value = feConvert(r2.value, r2.type, r2.options);
      feDraw(pre2);
      feFocus(pre2 + '-fv-' + j);
    }
  });

  // ---- ⑨ プロジェクト作成 ----
  function viewNew() {
    return head('プロジェクトを作成', 'テンプレートを選ぶと、配下のタスクが自動で作られます', '') +
      '<section class="card"><div class="card-body" style="max-width:620px">' +
        '<div class="field"><label for="n-name">プロジェクト名</label><input id="n-name" type="text" placeholder="例：コーポレートサイトリニューアル"></div>' +
        '<div class="row2">' +
          '<div class="field"><label for="n-tpl">テンプレート</label><select id="n-tpl">' +
            optionList([['', 'テンプレートを使わない']].concat(
              S.templates.map(function (t) { return [t.template_id, t.name]; })), '') +
            '</select><div class="help" id="n-tpl-help">使わない場合、タスクは作られません。作成後に足します</div></div>' +
          '<div class="field"><label for="n-key">キー</label>' +
            '<input id="n-key" type="text" maxlength="10" placeholder="例：CORP" style="text-transform:uppercase">' +
            '<div class="help">タスクのキーの頭になります（CORP-1）。英大文字で始まる2〜10文字。他と重ならない値にしてください</div></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label for="n-start">開始日</label><input id="n-start" type="date" value="' + esc(S.today) + '"></div>' +
          '<div class="field"><label for="n-end">終了日</label>' +
            '<input id="n-end" type="date" value="">' +
            '<div class="help" id="n-end-help">テンプレートを選ぶと、いちばん後ろのタスクから自動で決まります</div></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label for="n-owner">オーナー</label><select id="n-owner">' +
            optionList(S.users.map(function (u) { return [u.user_id, u.name]; }), S.me ? S.me.user_id : '') + '</select></div>' +
        '</div>' +
        '<div id="n-fields"></div>' +
        '<button class="btn primary" id="n-create">この内容で作成</button>' +
      '</div></section>' +
      '<section class="card" id="n-preview" hidden></section>';
  }

  document.addEventListener('change', function (e) {
    if (e.target.id === 'n-tpl') loadTemplateFields(e.target.value);
    if (e.target.id === 'n-start') renderPreview();
  });
  document.addEventListener('click', function (e) {
    if (e.target.id === 'n-create') createProjectNow();
  });

  var tplFields = [], tplItems = [];

  /**
   * 作られるタスクと、そこから決まる終了日を出す（要件 F-1-6）。
   * テンプレートの日付は「開始日からの相対日数」なので、開始日を変えると全部ずれる。
   */
  function renderPreview() {
    var box = $('n-preview'), endEl = $('n-end'), help = $('n-end-help');
    if (!box) return;
    var start = $('n-start') ? $('n-start').value : '';

    // テンプレートを使わないとき。何も出さないと「選び忘れたのか、これでよいのか」が分からない
    if (!tplItems.length) {
      if (endEl) { endEl.disabled = false; }
      if (help) help.textContent = 'テンプレートを使わないので、終了日を入れてください';
      box.hidden = false;
      box.innerHTML =
        '<div class="card-head"><h2>作られるタスク</h2><span class="faint">0 件</span></div>' +
        '<div class="card-body">' +
          '<p style="margin:0 0 10px">テンプレートを使わないので、<strong>タスクは作られません。</strong>' +
          '空のプロジェクトができます。</p>' +
          '<p style="margin:0;color:var(--text-muted);font-size:14px">' +
          '作成したあと、プロジェクトの画面から「＋ タスクを追加」で1件ずつ足してください。' +
          '親タスクを作ってから、その下に子タスクを足せます。</p>' +
        '</div>';
      return;
    }
    if (!start) { box.hidden = true; return; }

    var byParent = {};
    tplItems.forEach(function (t) {
      if (Number(t.level) !== 2) return;
      (byParent[t.parent_template_item_id] = byParent[t.parent_template_item_id] || []).push(t);
    });

    var last = start;
    function line(t, lv) {
      var s = H.addDays(start, Number(t.start_offset_days) || 0);
      var e = H.addDays(s, (Number(t.duration_days) || 1) - 1);
      if (e > last) last = e;
      return '<tr><td' + (lv === 2 ? ' style="padding-left:38px;color:var(--text-muted)"' : '') + '>' +
        (lv === 2 ? '└ ' : '') + esc(t.name) + '</td>' +
        '<td class="num" style="white-space:nowrap">' + H.formatDate(s) + ' 〜 ' + H.formatDate(e) +
        ' <span class="faint">' + H.durationDays(s, e) + '日</span></td></tr>';
    }

    var rows = tplItems.filter(function (t) { return Number(t.level) === 1; }).map(function (t) {
      return line(t, 1) + (byParent[t.template_item_id] || []).map(function (s) { return line(s, 2); }).join('');
    }).join('');

    if (endEl) { endEl.value = last; endEl.disabled = true; }
    if (help) help.textContent = 'テンプレートのいちばん後ろのタスクから自動で決まりました';

    box.hidden = false;
    box.innerHTML =
      '<div class="card-head"><h2>作られるタスク</h2><span class="faint">' + tplItems.length + ' 件</span>' +
        '<span class="spacer"></span><span class="faint">終了日 ' + H.formatDate(last) + '</span></div>' +
      '<div class="tbl-wrap"><table class="tbl"><colgroup><col><col style="width:260px"></colgroup>' +
        '<thead><tr><th>タスク</th><th>期間</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  var tplReq = 0;   // 続けて選び直したとき、古い応答で上書きしないための番号
  function loadTemplateFields(templateId) {
    var my = ++tplReq;
    tplFields = []; tplItems = [];
    var keyEl = $('n-key');
    if (!templateId) {
      feReplaceTemplateRows('n', []);
      renderPreview();
      return;
    }
    // キーが空なら、テンプレートの接頭辞を入れておく（重なるときは作成時に知らせる）
    var tpl = S.templates.filter(function (t) { return t.template_id === templateId; })[0];
    if (keyEl && !keyEl.value && tpl && tpl.key_prefix) keyEl.value = tpl.key_prefix;
    var btn = $('n-create');
    if (btn) btn.disabled = true;
    google.script.run.withSuccessHandler(function (d) {
      if (my !== tplReq) return;
      if (btn) btn.disabled = false;
      tplFields = d.fields || [];
      tplItems = d.items || [];
      renderPreview();
      feReplaceTemplateRows('n', tplDefsFromFields(tplFields));
    }).withFailureHandler(function (err) {
      if (btn) btn.disabled = false;
      fail(err);
    }).getTemplateDetail(templateId);
  }

  function createProjectNow() {
    var fc = feCollect('n');
    if (!feCheck(fc)) return;
    var btn = $('n-create');
    btn.disabled = true; btn.textContent = '作成しています…';
    google.script.run
      .withSuccessHandler(function (p) {
        S.projects.push(p);
        S.items = null;
        toast('「' + p.name + '」を作成しました');
        google.script.run.withSuccessHandler(function (d) {
          d.summary.forEach(function (s) { S.summary[s.project_id] = s; });
          S.projectId = p.project_id; go('detail'); loadItems();
        }).withFailureHandler(fail).getBootstrap();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = 'この内容で作成';
        fail(err);
      })
      .createProject({
        name: $('n-name').value,
        key: $('n-key').value.trim().toUpperCase(),
        template_id: $('n-tpl').value,
        start_date: $('n-start').value,
        end_date: $('n-end').value,
        owner_user_id: $('n-owner').value,
        field_defs: fc.defs,
        custom_fields: fc.values
      });
  }

  // ---- プロジェクト設定 ----

        '<div class="field"><label for="p-key">キー</label><input id="p-key" type="text" maxlength="10" value="' + esc(p.key) + '" style="text-transform:uppercase">' +
          '<div class="help">タスクのキーの頭です。変えても、すでに作ったタスクのキーは変わりません</div></div>' +
      '</div>' +
      '<div class="field"><label for="p-desc">説明</label><textarea id="p-desc">' + esc(p.description || '') + '</textarea></div>' +
      '<div class="row2">' +
        '<div class="field"><label for="p-start">開始日</label><input id="p-start" type="date" value="' + esc(p.start_date) + '"></div>' +

      '</div>' +
      '<div class="row2">' +
        '<div class="field"><label for="p-owner">オーナー</label><select id="p-owner">' +
          optionList(S.users.map(function (u) { return [u.user_id, u.name]; }), p.owner_user_id) + '</select></div>' +
        '<div class="field"><label for="p-status">ステータス</label><select id="p-status">' +
          optionList(H.STATUS_ORDER.map(function (s) { return [s, H.STATUS_LABEL[s]]; }), p.status) + '</select></div>' +
      '</div>' +
      '<div id="p-custom"></div>' +
      '<button class="btn primary" id="p-save">保存</button>' +
    '</div></section>';
  }

  document.addEventListener('click', function (e) {
    if (e.target.id !== 'p-save') return;
    var p = project(S.projectId);
    var btn = e.target;
    var fc = feCollect('p');
    if (!feCheck(fc)) return;
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (r) {
        p.name = $('p-name').value; p.description = $('p-desc').value;
        p.start_date = $('p-start').value; p.end_date = $('p-end').value;
        p.owner_user_id = $('p-owner').value; p.status = $('p-status').value;
        p.key = $('p-key').value.toUpperCase();
        p.field_defs = r.field_defs;
        p.custom_fields = r.custom_fields;
        p.updated_at = r.updated_at;
        btn.disabled = false;
        toast('保存しました');
        render();
      })
      .withFailureHandler(function (err) { btn.disabled = false; fail(err); })
      .saveProject({
        project_id: p.project_id, updated_at: p.updated_at,
        name: $('p-name').value, description: $('p-desc').value,
        start_date: $('p-start').value, end_date: $('p-end').value,
        owner_user_id: $('p-owner').value, status: $('p-status').value,
        key: $('p-key').value.toUpperCase(),
        field_defs: fc.defs,
        custom_fields: fc.values
      });
  });

  /**
   * プロジェクト設定の設定項目を描く（F-3-13）。
   * 定義は作成時にテンプレートからコピーしてプロジェクトが持っている。あとでテンプレートを変えても変わらない（F-1-9）。
   */
  function loadProjectFields(p) {
    feSetup('p', 'p-custom', p.field_defs || [], p.custom_fields || {});
  }


  // ---- ⑦ タスクの編集（小窓） ----
  function openTaskEditor(itemId, projectIdForNew, parentIdForNew) {
    var item = itemId ? itemById(itemId) : null;
    var isNew = !item;
    var pid = isNew ? projectIdForNew : item.project_id;
    var p = project(pid);
    var kids = item ? (S.items || []).filter(function (x) { return x.parent_item_id === item.item_id; }) : [];
    var hasKids = kids.length > 0;

    if (isNew) {
      var pt = parentIdForNew ? itemById(parentIdForNew) : null;
      item = {
        item_id: '', project_id: pid, parent_item_id: parentIdForNew || '', name: '', description: '',
        item_type: 'work', assignee_user_id: '', status: 'not_started',
        // 子タスクなら親と同じ期間、タスクならプロジェクトと同じ期間を初期値にする
        start_date: pt ? pt.start_date : (p ? p.start_date : S.today),
        end_date: pt ? pt.end_date : (p ? p.end_date : S.today),
        progress_rate: 0
      };
    }

    var parents = itemsOf(pid).filter(function (x) { return Number(x.level) === 1 && x.item_id !== item.item_id; });

    $('modal').innerHTML =
      '<div class="m-head"><h2 id="modal-title">' + (isNew ? (parentIdForNew ? '子タスクを追加' : 'タスクを追加') : 'タスクの編集') + '</h2>' +
        '<span class="spacer"></span><span class="faint">' + esc(item.item_key || '(キーは自動)') + '</span></div>' +
      '<div class="m-body">' +
        '<div class="field"><label for="t-name">タスク名</label><input id="t-name" type="text" value="' + esc(item.name) + '"></div>' +
        '<div class="field"><label for="t-desc">説明</label><textarea id="t-desc">' + esc(item.description || '') + '</textarea></div>' +
        '<div class="row2">' +
          '<div class="field"><label for="t-type">種別</label><select id="t-type">' +
            optionList([['work', '作業'], ['bug', 'バグ'], ['req', '要望']], item.item_type) + '</select></div>' +
          '<div class="field"><label for="t-who">担当者</label><select id="t-who">' +
            optionList([['', '未アサイン']].concat(S.users.map(function (u) { return [u.user_id, u.name]; })), item.assignee_user_id) + '</select></div>' +
        '</div>' +
        (isNew
          ? '<div class="field"><label for="t-parent">親タスク</label><select id="t-parent">' +
            optionList([['', 'なし（タスクとして作る）']].concat(
              parents.map(function (x) { return [x.item_id, x.name]; })), parentIdForNew || '') +
            '</select><div class="help">選ぶと、その下の子タスクになります</div></div>'
          : '') +
        '<div class="row2">' +
          '<div class="field"><label for="t-start">開始日</label><input id="t-start" type="date" value="' + esc(item.start_date || '') + '"></div>' +
          '<div class="field"><label for="t-end">終了日</label><input id="t-end" type="date" value="' + esc(item.end_date || '') + '"></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label for="t-status">ステータス</label><select id="t-status">' +
            optionList(H.STATUS_ORDER.map(function (s) { return [s, H.STATUS_LABEL[s]]; }), item.status) + '</select>' +
            '<div class="help">完了にすると進捗率は自動で100%になります</div></div>' +
          '<div class="field"><label for="t-rate">進捗率（%）</label>' +
            '<input id="t-rate" type="number" min="0" max="100" step="5" value="' +
              (hasKids ? '' : (item.progress_rate === '' || item.progress_rate === null ? 0 : item.progress_rate)) + '"' +
              (hasKids ? ' disabled' : '') + '>' +
            '<div class="help">' + (hasKids
              ? '<strong>子タスクを持つので入力できません。</strong>子 ' + kids.length + ' 件の平均になります'
              : '状態の判定には使いません。進み具合を見るための数字です') + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="m-foot">' +
        (isNew ? '' : '<button class="btn" id="t-del">削除</button>') +
        '<span class="spacer"></span>' +
        '<button class="btn" id="t-cancel">やめる</button>' +
        '<button class="btn primary" id="t-save">' + (isNew ? '追加' : '保存') + '</button>' +
      '</div>';

    $('modal').hidden = false;
    $('backdrop').hidden = false;
    $('t-name').focus();

    $('t-cancel').onclick = closeModal;
    $('backdrop').onclick = closeModal;
    if ($('t-del')) $('t-del').onclick = function () { removeTask(item, kids.length); };
    $('t-save').onclick = function () { saveTask(item, isNew, hasKids); };
  }

  /** 親タスクを決めた状態で「子タスクを追加」を開く */
  function openSubTaskEditor(parentItemId) {
    var parent = itemById(parentItemId);
    if (!parent) { toast('親タスクが見つかりません', true); return; }
    openTaskEditor(null, parent.project_id, parentItemId);
  }

  function closeModal() {
    $('modal').hidden = true;
    $('backdrop').hidden = true;
    $('modal').innerHTML = '';
  }

  function saveTask(item, isNew, hasKids) {
    var payload = {
      name: $('t-name').value,
      description: $('t-desc').value,
      item_type: $('t-type').value,
      assignee_user_id: $('t-who').value,
      status: $('t-status').value,
      start_date: $('t-start').value,
      end_date: $('t-end').value,
      progress_rate: hasKids ? null : Number($('t-rate').value || 0)
    };
    var btn = $('t-save');
    btn.disabled = true; btn.textContent = '保存しています…';

    function done(msg) {
      toast(msg);
      closeModal();
      S.items = null;
      render();
      loadItems();
      google.script.run.withSuccessHandler(function (d) {
        d.summary.forEach(function (s) { S.summary[s.project_id] = s; });
        S.unread = d.unread; $('bell-dot').hidden = !d.unread;
      }).getBootstrap();
    }
    function ng(err) { btn.disabled = false; btn.textContent = isNew ? '追加' : '保存'; fail(err); }

    if (isNew) {
      payload.project_id = item.project_id;
      payload.parent_item_id = $('t-parent') ? $('t-parent').value : '';
      google.script.run.withSuccessHandler(function () { done('追加しました'); }).withFailureHandler(ng).addItem(payload);
    } else {
      payload.item_id = item.item_id;
      payload.updated_at = item.updated_at;
      google.script.run.withSuccessHandler(function () { done('保存しました'); }).withFailureHandler(ng).saveItem(payload);
    }
  }

  function removeTask(item, kidCount) {
    var msg = kidCount
      ? '子タスクが ' + kidCount + ' 件あります。まとめて削除しますか？'
      : 'このタスクを削除しますか？';
    if (!window.confirm(msg)) return;
    google.script.run
      .withSuccessHandler(function () {
        toast('削除しました');
        closeModal();
        S.items = null; render(); loadItems();
      })
      .withFailureHandler(fail)
      .deleteItem(item.item_id, kidCount > 0);
  }

  // ---- ⑰ お知らせ ----
  var NOTIFY_KIND_LABEL = { assigned: '担当になった', unassigned: '担当から外れた', due: '期限が近い', delayed: '遅延になった' };

  function loadNotifications() {
    google.script.run.withSuccessHandler(function (list) {
      var rows = list.map(function (n) {
        var nameHtml = n.item_id
          ? '<a class="t" href="javascript:void(0)" data-edit="' + esc(n.item_id) + '" style="display:inline;font-weight:' + (n.read ? '400' : '700') + '">' + esc(n.title) + '</a>'
          : '<span class="t" style="font-weight:' + (n.read ? '400' : '700') + '">' + esc(n.title) + '</span>';
        return '<tr' + (n.read ? '' : ' style="background:var(--accent-soft)"') + '>' +
          '<td><div class="cell">' + nameHtml +
            '<span class="s">' + esc(NOTIFY_KIND_LABEL[n.kind] || n.kind) + ' ・ ' +
            esc(String(n.created_at).replace('T', ' ').slice(0, 16)) + '</span></div></td></tr>';
      }).join('');
      $('main').innerHTML = head('お知らせ', '画面の中だけの知らせです。メールやチャットには送りません',
          (list.some(function (n) { return !n.read; }) ? '<button class="btn" id="n-read">すべて既読にする</button>' : '')) +
        '<section class="card"><div class="tbl-wrap">' +
          (list.length ? '<table class="tbl"><tbody>' + rows + '</tbody></table>'
                       : '<div class="empty">お知らせはありません</div>') +
        '</div></section>';
      var b = $('n-read');
      if (b) b.onclick = function () {
        b.disabled = true;
        google.script.run.withSuccessHandler(function (r) {
          S.unread = r.unread; $('bell-dot').hidden = !r.unread;
          toast('既読にしました'); loadNotifications();
        }).withFailureHandler(fail).markNotificationsRead(list.filter(function (n) { return !n.read; })
          .map(function (n) { return n.notification_id; }));
      };
    }).withFailureHandler(fail).getNotifications();
  }

  /* ================================================================
   * ⑱ 判定ルール：状態の決め方を1画面で説明する（要件 §3、F-5-12）
   * 設定できる値は無い。数値が変わることも無いので、静的な説明でよい。
   * ================================================================ */
  function viewRules() {
    var pal = ['done', 'delayed', 'not_started', 'on_track', 'no_period'].map(function (h) {
      return '<div style="display:flex;align-items:center;gap:10px;padding:6px 0">' + badge(h) +
        '<span class="faint">' + { done: '完了。ステータスが完了', delayed: '終了日を過ぎて未完了', not_started: '開始日より前',
          on_track: 'それ以外。まだ終了日を過ぎていない', no_period: '開始日か終了日が入っていない' }[h] + '</span></div>';
    }).join('');

    return head('判定ルール', '状態の決め方をまとめています。設定できる値はありません', '') +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(min(420px,100%),1fr));gap:16px;align-items:start">' +

      '<section class="card"><div class="card-head"><h2>1. 予定進捗率</h2></div><div class="card-body">' +
        '<div style="font-family:ui-monospace,monospace;font-size:13px;background:var(--surface-2);border:1px solid var(--border);' +
          'border-radius:8px;padding:10px 12px;line-height:1.9">' +
          '予定進捗率 ＝ （今日 − 開始日 ＋ 1）÷（終了日 − 開始日 ＋ 1）<br>0%〜100% に収める' +
        '</div><p class="help" style="margin-top:10px">「今日の時点で本来どこまで進んでいるはずか」です。<strong>状態の判定には使いません</strong>。進捗バーの縦線で見る、参考の数字です。</p>' +
      '</div></section>' +

      '<section class="card"><div class="card-head"><h2>2. 実績進捗率（手入力）</h2></div><div class="card-body">' +
        '<p>子タスクを持たないタスクは、担当者が入れた％をそのまま使います。未入力は0%。完了にすると自動で100%。</p>' +
        '<p>子タスクを持つタスクとプロジェクトは、<strong>子の単純平均</strong>です（手入力できません）。</p>' +
        '<p class="help">この数字も<strong>状態の判定には使いません</strong>。進み具合を人が見るための数字です。</p>' +
      '</div></section>' +

      '<section class="card"><div class="card-head"><h2>3. 状態（上から順に判定）</h2></div><div class="card-body">' +
        '<ol style="margin:0;padding-left:20px;line-height:2">' +

          '<li><strong>終了日を過ぎて未完了</strong> → ' + badge('delayed') + '</li>' +
          '<li>開始日・終了日が無い → ' + badge('no_period') + '</li>' +
          '<li>開始日より前 → ' + badge('not_started') + '</li>' +
          '<li>それ以外 → ' + badge('on_track') + '</li>' +
        '</ol>' +

          '<strong>2番目が要点です。</strong>進捗率を見ずに判定するので、担当者が％を更新しないまま放置しても、' +
          '終了日を過ぎれば必ず赤くなります。' +
        '</div>' +
        '<p class="help" style="margin-top:10px">親の状態は親自身の終了日で判定します。配下の遅延は「配下 n件」として別に出します。</p>' +

      '<section class="card"><div class="card-head"><h2>4. 遅れの出し方</h2></div><div class="card-body">' +

          'border-radius:8px;padding:10px 12px;line-height:1.9">' +

  /* ================================================================
   * ⑮ 設定：お知らせの種類・権限・共通マスタの状況
   * ================================================================ */
  var SETTINGS_TABS = [
    { k: 'notify', label: 'お知らせ' },
    { k: 'roles', label: '権限' },
    { k: 'common', label: '共通マスタ' }
  ];

  function viewSettings() {
    var tab = SETTINGS_TABS.some(function (t) { return t.k === S.settingsTab; }) ? S.settingsTab : 'notify';
    var pageHead = head('設定', 'お知らせの種類・権限・共通マスタとのつながりを管理します', '');
    var tabsHtml = '<div class="tabs">' + SETTINGS_TABS.map(function (t) {
      return '<button data-stab="' + t.k + '"' + (t.k === tab ? ' class="active"' : '') + '>' + t.label + '</button>';
    }).join('') + '</div>';

    var body;
    if (tab === 'roles') body = settingsRolesBody();
    else if (tab === 'common') body = settingsCommonBody();
    else body = settingsNotifyBody();

    return pageHead + tabsHtml + body;
  }

  function settingsNotifyBody() {
    var s = S.settings || {};
    var isTrue = function (v) { return String(v).toUpperCase() === 'TRUE' || v === true; };
    var isAdmin = S.me && S.me.role === 'admin';
    return '<section class="card"><div class="card-head"><h2>お知らせの種類</h2></div><div class="card-body">' +
      (isAdmin ? '' : '<p class="help" style="margin:0 0 14px">この内容を変えられるのは管理者だけです。いまは閲覧のみです。</p>') +
      [['notify_assign', '担当になった／外れた', 'タスクの担当者を変えたとき、その場で新旧の担当者に出します'],
       ['notify_due', '期限の前日と当日', '毎朝のトリガーでまとめて作ります'],
       ['notify_delayed', '遅延になった', '前日は遅延でなかったタスクが遅延になったときだけ出します']
      ].map(function (r) {
        return '<div class="field" style="display:flex;align-items:flex-start;gap:10px">' +
          '<input type="checkbox" id="st-' + r[0] + '" style="margin-top:3px"' + (isTrue(s[r[0]]) ? ' checked' : '') + (isAdmin ? '' : ' disabled') + '>' +
          '<div><label for="st-' + r[0] + '" style="margin:0;color:var(--text);font-weight:600">' + r[1] + '</label>' +
          '<div class="help" style="margin-top:2px">' + r[2] + '</div></div></div>';
      }).join('') +
      '<div class="field"><label for="st-keep">お知らせを残す日数</label>' +
        '<input id="st-keep" type="number" min="7" max="365" style="width:120px" value="' + esc(s.notify_keep_days || 90) + '"' + (isAdmin ? '' : ' disabled') + '>' +
        '<div class="help">これより古いものは毎朝まとめて消します</div></div>' +
      '<p class="help" style="margin:14px 0 0">メール・チャットへの送信は行いません（スコープ外）。画面の中だけで知らせます。</p>' +
      (isAdmin ? '<button class="btn primary" id="st-save" style="margin-top:14px">保存</button>' : '') +
    '</div></section>';
  }

  function settingsRolesBody() {
    var isAdmin = S.me && S.me.role === 'admin';
    var box = '<section class="card"><div class="card-head"><h2>権限（管理者／担当者）</h2></div><div class="card-body">' +
      '<p class="help" style="margin:0 0 14px">' +
        '管理者は、設定・テンプレートの編集ができます。担当者は、タスクの操作だけができます。<br>' +
        '<strong>役職はこのアプリだけの概念です。</strong>身元（氏名・メール）は共通マスタから読むため、ここでは変えられません。' +
      '</p>' +
      (isAdmin ? '' : '<p class="help" style="margin:0 0 14px">権限を変えられるのは管理者だけです。いまは閲覧のみです。</p>') +
      '<div id="roles-body"><div class="help">読み込んでいます…</div></div>' +
    '</div></section>';

    google.script.run.withSuccessHandler(function (roles) {
      var box2 = $('roles-body');
      if (!box2) return;
      var roleMap = {};
      roles.forEach(function (r) { roleMap[String(r.email).toLowerCase()] = r.role; });
      var rows = S.users.filter(function (u) { return u.email; }).map(function (u) {
        var role = roleMap[String(u.email).toLowerCase()] || 'member';
        return '<tr><td><div class="cell"><span class="t">' + esc(u.name) + '</span><span class="s">' + esc(u.email) + '</span></div></td>' +
          '<td>' + (isAdmin
            ? '<select class="inline" data-role-email="' + esc(u.email) + '">' +
                optionList([['member', '担当者'], ['admin', '管理者']], role) + '</select>'
            : '<span class="chip">' + (role === 'admin' ? '管理者' : '担当者') + '</span>') + '</td></tr>';
      }).join('');
      box2.innerHTML = '<table class="tbl"><colgroup><col><col style="width:140px"></colgroup>' +
        '<thead><tr><th>担当者</th><th>権限</th></tr></thead><tbody>' + rows + '</tbody></table>';
      box2.querySelectorAll('[data-role-email]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          var email = this.getAttribute('data-role-email'), self = this;
          self.disabled = true;
          var u = S.users.filter(function (x) { return x.email === email; })[0];
          google.script.run.withSuccessHandler(function () { toast('権限を保存しました'); self.disabled = false; })
            .withFailureHandler(function (err) { fail(err); self.disabled = false; self.value = 'member'; })
            .saveRole({ email: email, name: u ? u.name : email, role: self.value });
        });
      });
    }).withFailureHandler(fail).getRoles();

    return box;
  }

  function settingsCommonBody() {
    var src = S.peopleSource || 'ローカル';
    var srcLabel = { common: '共通マスタ', '控え': '控え（共通マスタが読めないため）', 'ローカル': 'このアプリの users シート' }[src] || src;
    return '<section class="card"><div class="card-head"><h2>共通マスタとのつながり</h2></div><div class="card-body">' +
      '<dl style="display:grid;grid-template-columns:140px 1fr;gap:10px 16px;margin:0 0 14px;font-size:14px">' +
        '<dt class="faint">いまの読み込み元</dt><dd style="margin:0">' + esc(srcLabel) + '</dd>' +
        '<dt class="faint">担当者の数</dt><dd style="margin:0">' + S.users.length + ' 人</dd>' +
      '</dl>' +
      (S.peopleNote ? '<div class="help" style="padding:10px 12px;background:var(--surface-2);border-radius:8px">' + esc(S.peopleNote) + '</div>' : '<p class="help" style="margin:0">正常に読み込めています。</p>') +
      '<p class="help" style="margin-top:14px">人（担当者・オーナー）の氏名・メール・所属は、別システムと同じ共通マスタから<strong>読むだけ</strong>で使います。このアプリから共通マスタへは一切書き込みません。' +
        '設定はエディタの「プロジェクトの設定 ▸ スクリプト プロパティ」の <code>COMMON_MASTER_SS_ID</code> で行います。</p>' +
    '</div></section>';
  }

  /* ================================================================
   * ⑯ テンプレート編集（管理者のみ操作できる。閲覧は全員）
   * タスク構成・設定項目の追加／編集は小窓（既存の #modal を使い回す）、
   * 一覧は常にサーバーの最新を読み直してから描く（他の管理者との食い違いを防ぐ）。
   * ================================================================ */
  var tplFull = { list: [], items: [], fields: [] };   // 選んでいるテンプレートの詳細

  function loadTemplatesView() {
    google.script.run.withSuccessHandler(function (list) {
      tplFull.list = list;
      if (!S.tplSelected || !list.some(function (t) { return t.template_id === S.tplSelected; })) {
        S.tplSelected = list.length ? list[0].template_id : null;
      }
      if (!S.tplSelected) { renderTemplatesView(); return; }
      google.script.run.withSuccessHandler(function (d) {
        tplFull.items = d.items || []; tplFull.fields = d.fields || [];
        renderTemplatesView();
      }).withFailureHandler(fail).getTemplateDetail(S.tplSelected);
    }).withFailureHandler(fail).getTemplates();
  }

  function renderTemplatesView() {
    var m = $('main');
    if (!m || S.view !== 'templates') return;
    var isAdmin = S.me && S.me.role === 'admin';
    var cur = tplFull.list.filter(function (t) { return t.template_id === S.tplSelected; })[0];

    var listHtml = '<div class="tpl-list">' + tplFull.list.map(function (t) {
      return '<button type="button" data-tplpick="' + esc(t.template_id) + '"' + (t.template_id === S.tplSelected ? ' class="active"' : '') + '>' +
        esc(t.name) + '<div class="faint" style="font-size:12px;margin-top:2px">タスク ' + t.item_count + ' 件 ・ 設定項目 ' + t.field_count + ' 件' +
        (t.active === false ? ' ・ 無効' : '') + '</div></button>';
    }).join('') + '</div>';

    var right = '<div class="empty">テンプレートがありません。「＋ 新しいテンプレート」から作ってください</div>';

    if (cur) {
      var byParent = {};
      tplFull.items.forEach(function (x) { if (Number(x.level) === 2) (byParent[x.parent_template_item_id] = byParent[x.parent_template_item_id] || []).push(x); });
      var top = tplFull.items.filter(function (x) { return Number(x.level) === 1; }).sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });

      var itemRows = top.map(function (t) {
        var kids = (byParent[t.template_item_id] || []).sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); });
        return tiRow(t, false) + kids.map(function (k) { return tiRow(k, true); }).join('');
      }).join('');

      function tiRow(t, isSub) {
        return '<div class="ti-row' + (isSub ? ' lv2' : '') + '">' +
          '<span class="faint" title="種別">' + { work: '▣', bug: '✳', req: '◈' }[t.item_type] + '</span>' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (isSub ? '└ ' : '') + esc(t.name) + '</span>' +
          '<span class="faint num" style="text-align:right">開始+' + t.start_offset_days + '日</span>' +
          '<span class="faint num" style="text-align:right">' + t.duration_days + '日間</span>' +
          (isAdmin
            ? '<span style="display:flex;gap:4px">' +
                '<button type="button" class="btn sm" data-ti-edit="' + esc(t.template_item_id) + '" aria-label="編集" title="編集">✎</button>' +
                (isSub ? '' : '<button type="button" class="btn sm" data-ti-addsub="' + esc(t.template_item_id) + '" aria-label="子タスクを追加" title="子タスクを追加">＋</button>') +
                '<button type="button" class="btn sm" data-ti-del="' + esc(t.template_item_id) + '" aria-label="削除" title="削除">×</button>' +
              '</span>'
            : '<span></span>') +
        '</div>';
      }

      var fieldRows = tplFull.fields.sort(function (a, b) { return (a.sort_order || 0) - (b.sort_order || 0); }).map(function (f) {
        var typeLabel = FIELD_TYPE_LABEL[f.type] || f.type;
        return '<div class="ff-row">' +
          '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(f.label) + '<span class="faint" style="margin-left:6px">' + esc(f.field_key) + '</span></span>' +
          '<span class="faint">' + typeLabel + (f.type === 'select' ? '：' + (f.options || []).join('／') : '') + '</span>' +
          '<span class="faint">' + (f.required ? '必須' : '任意') + '</span>' +
          (isAdmin
            ? '<button type="button" class="btn sm" data-ff-edit="' + esc(f.field_id) + '" aria-label="編集" title="編集">✎</button>' +
              '<button type="button" class="btn sm" data-ff-del="' + esc(f.field_id) + '" aria-label="削除" title="削除">×</button>'
            : '<span></span><span></span>') +
        '</div>';
      }).join('');

      right = '<section class="card" style="margin-bottom:20px"><div class="card-body">' +
          '<div class="row2">' +
            '<div class="field"><label for="tp-name">名称</label><input id="tp-name" type="text" value="' + esc(cur.name) + '"' + (isAdmin ? '' : ' disabled') + '></div>' +
            '<div class="field"><label for="tp-prefix">キーの接頭辞</label><input id="tp-prefix" type="text" maxlength="10" style="text-transform:uppercase" value="' + esc(cur.key_prefix) + '"' + (isAdmin ? '' : ' disabled') + '>' +
              '<div class="help">作成するプロジェクトのタスクキー（例：WEB-1）の頭になります</div></div>' +
          '</div>' +
          '<div class="field"><label for="tp-desc">説明</label><textarea id="tp-desc" rows="2"' + (isAdmin ? '' : ' disabled') + '>' + esc(cur.description || '') + '</textarea></div>' +
          (isAdmin
            ? '<label class="help" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="tp-active"' + (cur.active !== false ? ' checked' : '') + '> 作成画面の選択肢に出す（無効にすると出なくなります。既存プロジェクトには影響しません）</label>' +
              '<div class="btn-row" style="display:flex;gap:10px;margin-top:14px">' +
                '<button class="btn primary" id="tp-save">保存</button>' +
                '<button class="btn" id="tp-delete" style="margin-left:auto">このテンプレートを削除</button>' +
              '</div>'
            : '') +
        '</div></section>' +

        '<section class="card" style="margin-bottom:20px">' +
          '<div class="card-head"><h2>タスク構成</h2><span class="faint">' + top.length + ' 件（子含め ' + tplFull.items.length + ' 件）</span>' +
            '<span class="spacer"></span><span class="help">日付は「開始日からの相対日数」で持ちます</span></div>' +
          '<div class="tbl-wrap">' +
            '<div class="ti-row head"><span></span><span>タスク名</span><span style="text-align:right">開始（日目）</span><span style="text-align:right">期間（日数）</span><span></span></div>' +
            (itemRows || '<div class="empty">タスクがありません</div>') +
          '</div>' +
          (isAdmin ? '<div class="card-body" style="border-top:1px solid var(--border)"><button class="btn sm" id="ti-add">＋ タスクを追加</button></div>' : '') +
        '</section>' +

        '<section class="card">' +
          '<div class="card-head"><h2>設定項目</h2><span class="faint">' + tplFull.fields.length + ' 件</span>' +
            '<span class="spacer"></span><span class="help">プロジェクト作成の画面にこの欄が出ます</span></div>' +
          '<div class="tbl-wrap">' +
            '<div class="ff-row head"><span>表示名</span><span>型</span><span>必須</span><span></span><span></span></div>' +
            (fieldRows || '<div class="empty">設定項目がありません</div>') +
          '</div>' +
          (isAdmin ? '<div class="card-body" style="border-top:1px solid var(--border)"><button class="btn sm" id="ff-add">＋ 項目を追加</button></div>' : '') +
        '</section>';
    }

    m.innerHTML = head('テンプレート編集', 'プロジェクト作成時のタスク構成と設定項目を管理します',
        isAdmin ? '<button class="btn primary" id="tp-new">＋ 新しいテンプレート</button>' : '') +
      (isAdmin ? '' : '<div class="toolbar"><span class="help">閲覧のみです。編集できるのは管理者だけです</span></div>') +
      '<div style="display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start">' +
        '<section class="card"><div class="card-head"><h2>テンプレート</h2></div><div class="tbl-wrap">' + listHtml + '</div></section>' +
        '<div>' + right + '</div>' +
      '</div>';

    wireTemplatesView(cur, isAdmin);
  }

  function wireTemplatesView(cur, isAdmin) {
    var tn = $('tp-new');
    if (tn) tn.onclick = openNewTemplateModal;
    if (!cur) return;

    var save = $('tp-save');
    if (save) save.onclick = function () {
      save.disabled = true;
      google.script.run.withSuccessHandler(function () { toast('保存しました'); loadTemplatesView(); })
        .withFailureHandler(function (err) { save.disabled = false; fail(err); })
        .updateTemplate({
          template_id: cur.template_id, name: $('tp-name').value, description: $('tp-desc').value,
          key_prefix: $('tp-prefix').value, active: $('tp-active').checked
        });
    };
    var del = $('tp-delete');
    if (del) del.onclick = function () {
      if (!window.confirm('「' + cur.name + '」を削除しますか？\nすでにこのテンプレートで作ったプロジェクトには影響しません（作成時にコピーされているため）。')) return;
      google.script.run.withSuccessHandler(function () {
        S.templates = S.templates.filter(function (t) { return t.template_id !== cur.template_id; });
        S.tplSelected = null; toast('削除しました'); loadTemplatesView();
      }).withFailureHandler(fail).deleteTemplate(cur.template_id);
    };
    var tiAdd = $('ti-add');
    if (tiAdd) tiAdd.onclick = function () { openTemplateItemModal(cur.template_id, null, null); };
    document.querySelectorAll('[data-ti-addsub]').forEach(function (b) {
      b.addEventListener('click', function () { openTemplateItemModal(cur.template_id, this.getAttribute('data-ti-addsub'), null); });
    });
    document.querySelectorAll('[data-ti-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var it = tplFull.items.filter(function (x) { return x.template_item_id === this.getAttribute('data-ti-edit'); }, this)[0];
        openTemplateItemModal(cur.template_id, it ? it.parent_template_item_id : null, it);
      });
    });
    document.querySelectorAll('[data-ti-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = this.getAttribute('data-ti-del');
        var kids = tplFull.items.filter(function (x) { return x.parent_template_item_id === id; });
        if (!window.confirm('このタスクを削除しますか？' + (kids.length ? '（子タスク ' + kids.length + ' 件も一緒に消えます）' : ''))) return;
        google.script.run.withSuccessHandler(function () { toast('削除しました'); loadTemplatesView(); }).withFailureHandler(fail).deleteTemplateItem(id);
      });
    });
    var ffAdd = $('ff-add');
    if (ffAdd) ffAdd.onclick = function () { openTemplateFieldModal(cur.template_id, null); };
    document.querySelectorAll('[data-ff-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = tplFull.fields.filter(function (x) { return x.field_id === this.getAttribute('data-ff-edit'); }, this)[0];
        openTemplateFieldModal(cur.template_id, f);
      });
    });
    document.querySelectorAll('[data-ff-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = this.getAttribute('data-ff-del');
        if (!window.confirm('この設定項目を削除しますか？')) return;
        google.script.run.withSuccessHandler(function () { toast('削除しました'); loadTemplatesView(); }).withFailureHandler(fail).deleteTemplateField(id);
      });
    });
  }

  function openNewTemplateModal() {
    $('modal').innerHTML =
      '<div class="m-head"><h2 id="modal-title">新しいテンプレート</h2></div>' +
      '<div class="m-body">' +
        '<div class="field"><label for="ntp-name">名称</label><input id="ntp-name" type="text" placeholder="例：展示会・イベント出展"></div>' +
        '<div class="field"><label for="ntp-prefix">キーの接頭辞</label><input id="ntp-prefix" type="text" maxlength="10" style="text-transform:uppercase" placeholder="例：EVT">' +
          '<div class="help">英大文字で始まる2〜10文字。作られるタスクのキー（EVT-1）の頭になります</div></div>' +
        '<div class="field"><label for="ntp-desc">説明</label><textarea id="ntp-desc" rows="2"></textarea></div>' +
      '</div>' +
      '<div class="m-foot"><span class="spacer"></span><button class="btn" id="ntp-cancel">やめる</button><button class="btn primary" id="ntp-create">作成</button></div>';
    $('modal').hidden = false; $('backdrop').hidden = false; $('ntp-name').focus();
    $('backdrop').onclick = closeModal; $('ntp-cancel').onclick = closeModal;
    $('ntp-create').onclick = function () {
      var btn = $('ntp-create'); btn.disabled = true;
      google.script.run.withSuccessHandler(function (t) {
        S.templates.push({ template_id: t.template_id, name: t.name, key_prefix: t.key_prefix, active: true });
        S.tplSelected = t.template_id; closeModal(); toast('作成しました'); loadTemplatesView();
      }).withFailureHandler(function (err) { btn.disabled = false; fail(err); })
        .createTemplate({ name: $('ntp-name').value, key_prefix: $('ntp-prefix').value, description: $('ntp-desc').value });
    };
  }

  function openTemplateItemModal(templateId, parentId, existing) {
    var isNew = !existing;
    var parents = tplFull.items.filter(function (x) { return Number(x.level) === 1; });
    $('modal').innerHTML =
      '<div class="m-head"><h2 id="modal-title">' + (isNew ? (parentId ? '子タスクを追加' : 'タスクを追加') : 'タスクを編集') + '</h2></div>' +
      '<div class="m-body">' +
        '<div class="field"><label for="ti-name">タスク名</label><input id="ti-name" type="text" value="' + esc(existing ? existing.name : '') + '"></div>' +
        '<div class="row2">' +
          '<div class="field"><label for="ti-type">種別</label><select id="ti-type">' +
            optionList([['work', '作業'], ['bug', 'バグ'], ['req', '要望']], existing ? existing.item_type : 'work') + '</select></div>' +
          (parentId
            ? '<div class="field"><label>親タスク</label><input type="text" value="' + esc((parents.filter(function (p) { return p.template_item_id === parentId; })[0] || {}).name || '') + '" disabled></div>'
            : '<div class="field"><label for="ti-parent">親タスク</label><select id="ti-parent">' +
                optionList([['', 'なし（タスクとして作る）']].concat(parents.filter(function (p) { return !existing || p.template_item_id !== existing.template_item_id; }).map(function (p) { return [p.template_item_id, p.name]; })),
                  existing ? existing.parent_template_item_id : '') + '</select></div>') +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label for="ti-offset">開始（プロジェクト開始日から何日目）</label><input id="ti-offset" type="number" min="0" value="' + (existing ? existing.start_offset_days : 0) + '"></div>' +
          '<div class="field"><label for="ti-duration">期間（日数）</label><input id="ti-duration" type="number" min="1" value="' + (existing ? existing.duration_days : 5) + '"></div>' +
        '</div>' +
      '</div>' +
      '<div class="m-foot"><span class="spacer"></span><button class="btn" id="ti-cancel">やめる</button><button class="btn primary" id="ti-save2">' + (isNew ? '追加' : '保存') + '</button></div>';
    $('modal').hidden = false; $('backdrop').hidden = false; $('ti-name').focus();
    $('backdrop').onclick = closeModal; $('ti-cancel').onclick = closeModal;
    $('ti-save2').onclick = function () {
      var btn = $('ti-save2'); btn.disabled = true;
      var payload = {
        template_id: templateId,
        template_item_id: existing ? existing.template_item_id : undefined,
        parent_template_item_id: parentId || ($('ti-parent') ? $('ti-parent').value : ''),
        name: $('ti-name').value, item_type: $('ti-type').value,
        start_offset_days: Number($('ti-offset').value || 0), duration_days: Number($('ti-duration').value || 1)
      };
      google.script.run.withSuccessHandler(function () { closeModal(); toast(isNew ? '追加しました' : '保存しました'); loadTemplatesView(); })
        .withFailureHandler(function (err) { btn.disabled = false; fail(err); }).saveTemplateItem(payload);
    };
  }

  function openTemplateFieldModal(templateId, existing) {
    var isNew = !existing;
    $('modal').innerHTML =
      '<div class="m-head"><h2 id="modal-title">' + (isNew ? '設定項目を追加' : '設定項目を編集') + '</h2></div>' +
      '<div class="m-body">' +
        '<div class="row2">' +
          '<div class="field"><label for="ff-label">表示名</label><input id="ff-label" type="text" value="' + esc(existing ? existing.label : '') + '" placeholder="例：クライアント名"></div>' +
          '<div class="field"><label for="ff-key">項目キー</label><input id="ff-key" type="text" value="' + esc(existing ? existing.field_key : '') + '" placeholder="例：client_name"' + (isNew ? '' : ' disabled') + '>' +
            '<div class="help">' + (isNew ? '英字で始まる英数字とアンダースコア。あとから変えられません' : '作成済みのため変えられません') + '</div></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label for="ff-type">型</label><select id="ff-type">' +
            optionList(FIELD_TYPE_ORDER.map(function (k) { return [k, FIELD_TYPE_LABEL[k]]; }), existing ? existing.type : 'text') + '</select></div>' +
          '<div class="field"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:26px">' +
            '<input type="checkbox" id="ff-required"' + (existing && existing.required ? ' checked' : '') + '> 必須にする</label></div>' +
        '</div>' +
        '<div class="field"><label for="ff-options">選択肢（型が「選択肢」のときだけ。カンマ区切り）</label>' +
          '<input id="ff-options" type="text" value="' + esc(existing && existing.options ? existing.options.join(', ') : '') + '" placeholder="例：新規, リニューアル, 保守"></div>' +
      '</div>' +
      '<div class="m-foot"><span class="spacer"></span><button class="btn" id="ff-cancel">やめる</button><button class="btn primary" id="ff-save2">' + (isNew ? '追加' : '保存') + '</button></div>';
    $('modal').hidden = false; $('backdrop').hidden = false; $('ff-label').focus();
    $('backdrop').onclick = closeModal; $('ff-cancel').onclick = closeModal;
    $('ff-save2').onclick = function () {
      var btn = $('ff-save2'); btn.disabled = true;
      var payload = {
        template_id: templateId, field_id: existing ? existing.field_id : undefined,
        label: $('ff-label').value, field_key: $('ff-key').value, type: $('ff-type').value,
        required: $('ff-required').checked, options: $('ff-options').value
      };
      google.script.run.withSuccessHandler(function () { closeModal(); toast(isNew ? '追加しました' : '保存しました'); loadTemplatesView(); })
        .withFailureHandler(function (err) { btn.disabled = false; fail(err); }).saveTemplateField(payload);
    };
  }

  boot();
})();
</script>
