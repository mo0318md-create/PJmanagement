<script>
/**
 * 画面の組み立て（簡易版）
 *
 * 読み込みは2段階（要件書 §5.1）
 *   ① getBootstrap() … プロジェクト一覧をすぐ描く
 *   ② getItems()     … タスク全件を裏で読む。終わるまでは「読み込み中」と出す
 * 以降の絞り込み・画面の切り替えはブラウザの中だけで走る。
 */
(function () {
  'use strict';

  // ---------------------------------------------------------------- 状態
  var S = {
    today: '', me: null, users: [], projects: [], summary: {}, templates: [], settings: {},
    items: null,              // null = まだ読み込み中
    view: 'projects', projectId: null, tab: 'overview',
    collapsed: {}, unread: 0,
    // 一覧の絞り込み（F-3-3）と並び順（F-3-4）
    pf: { health: '', owner: '', tpl: '', sort: 'delayed', done: false },
    // 概要の絞り込み（F-3-9）
    df: { delayedOnly: false },
    // ④ボード・⑤リスト・⑥ガントの表示設定
    boardAssignee: '', listGroupBy: 'status', ganttScale: 'week', ganttShowDone: true,
    // ⑪担当者一覧の並び順、⑫担当者別ガントの表示設定
    peopleSort: 'delayed', peopleGanttUser: '', peopleGanttGroupByProject: true, peopleGanttShowDone: false,
    // ②全プロジェクトのガントで開いているプロジェクト・絞り込み
    portfolioOpen: {}, portfolioScale: 'month', portfolioOwner: '', portfolioShowDone: false,
    // ①一覧／②ガント、⑪一覧／⑫ガント の切替（それぞれの画面の中のタブ）
    projectsTab: 'list', peopleTab: 'list',
    // ⑮設定の中のタブ
    settingsTab: 'notify',
    // ⑬個人ページで見ている人（未指定なら自分）
    memberUserId: null, memberTab: 'open',
    // ⑭マイタスクの区分タブ（S.tab とは別。S.tab はプロジェクト詳細専用）
    mineTab: 'delayed',
    // ⑯テンプレート編集で選んでいるテンプレート
    tplSelected: null
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function userName(id) {
    for (var i = 0; i < S.users.length; i++) if (S.users[i].user_id === id) return S.users[i].name;
    return '';
  }
  function project(id) {
    for (var i = 0; i < S.projects.length; i++) if (S.projects[i].project_id === id) return S.projects[i];
    return null;
  }
  function itemsOf(pid) {
    return (S.items || []).filter(function (x) { return x.project_id === pid; });
  }
  function itemById(id) {
    for (var i = 0; i < (S.items || []).length; i++) if (S.items[i].item_id === id) return S.items[i];
    return null;
  }

  // ---------------------------------------------------------------- 起動
  function boot() {
    google.script.run
      .withSuccessHandler(function (d) {
        S.today = d.today; S.me = d.me; S.users = d.users; S.projects = d.projects;
        S.templates = d.templates; S.settings = d.settings; S.unread = d.unread;
        d.summary.forEach(function (s) { S.summary[s.project_id] = s; });
        $('today').textContent = '今日 ' + d.today;
        $('me').textContent = d.me ? d.me.name : '未登録';
        $('bell-dot').hidden = !d.unread;
        S.peopleSource = d.peopleSource || 'ローカル';
        S.peopleNote = d.peopleNote || '';
        renderNav();
        applyInitialRoute();               // URLで指定された画面を開く
        loadItems();                       // ② 裏で読む。画面はもう出ている
        if (S.peopleNote) toast(S.peopleNote, S.peopleSource !== 'common');
      })
      .withFailureHandler(fail)
      .getBootstrap();
  }

  function loadItems() {
    google.script.run
      .withSuccessHandler(function (items) { S.items = items; render(); openPendingTask(); })
      .withFailureHandler(fail)
      .getItems();
  }

  function fail(err) {
    toast(err && err.message ? err.message : String(err), true);
    var m = $('main');
    if (m.querySelector('.loading')) m.innerHTML = '<div class="empty">読み込めませんでした。' + esc(String(err)) + '</div>';
  }

  var toastTimer = null;
  /** action: { label, fn } を渡すと、文のあとにボタンを出す（元に戻す など） */
  function toast(msg, isErr, action) {
    var t = $('toast');
    t.innerHTML = '<span>' + esc(msg) + '</span>' +
      (action ? '<button type="button" class="toast-act">' + esc(action.label) + '</button>' : '');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.hidden = false;
    if (action) {
      t.querySelector('.toast-act').onclick = function () { t.hidden = true; clearTimeout(toastTimer); action.fn(); };
    }
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, isErr ? 6000 : (action ? 6000 : 2600));
  }

  // ---------------------------------------------------------------- ナビ
  // mobile: true の5項目だけが、スマホ幅では画面下のタブバーに出る
  var NAV = [
    { group: 'プロジェクト単位' },
    { key: 'projects', ico: '▤', label: 'プロジェクト一覧', short: '一覧', mobile: true },
    { key: 'search', ico: '⌕', label: '横断検索', short: '検索', mobile: true },
    { key: 'new', ico: '＋', label: 'プロジェクト作成' },
    { group: '担当者単位' },
    { key: 'people', ico: '▥', label: '担当者一覧', short: '担当者', mobile: true },
    { key: 'mine', ico: '☑', label: 'マイタスク', short: 'マイタスク', mobile: true },
    { group: '管理' },
    { key: 'templates', ico: '⧉', label: 'テンプレート' },
    { key: 'settings', ico: '⚙', label: '設定', short: '設定', mobile: true },
    { key: 'rules', ico: '?', label: '判定ルール' },
    { key: 'notifications', ico: '🔔', label: 'お知らせ' }
  ];

  function renderNav() {
    $('sidebar').innerHTML = NAV.map(function (n) {
      if (n.group) return '<div class="group">' + esc(n.group) + '</div>';
      return '<a data-nav="' + n.key + '"' + (n.mobile ? ' data-mobile="1"' : '') +
        (n.key === S.view ? ' class="active"' : '') + '>' +
        '<span class="ico" aria-hidden="true">' + n.ico + '</span>' +
        '<span class="lbl">' + esc(n.label) + '</span>' +
        '<span class="short">' + esc(n.short || n.label) + '</span></a>';
    }).join('');
  }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var open = e.target.closest('[data-project]');
    if (open) { S.projectId = open.getAttribute('data-project'); go('detail'); return; }
    var tab = e.target.closest('[data-tab]');
    if (tab) { S.tab = tab.getAttribute('data-tab'); render(); return; }
    var ptab = e.target.closest('[data-ptab]');
    if (ptab) { S.projectsTab = ptab.getAttribute('data-ptab'); render(); return; }
    var petab = e.target.closest('[data-petab]');
    if (petab) { S.peopleTab = petab.getAttribute('data-petab'); render(); return; }
    var stab = e.target.closest('[data-stab]');
    if (stab) { S.settingsTab = stab.getAttribute('data-stab'); render(); return; }
    var mtab = e.target.closest('[data-mtab]');
    if (mtab) { S.memberTab = mtab.getAttribute('data-mtab'); render(); return; }
    var minetab = e.target.closest('[data-minetab]');
    if (minetab) { S.mineTab = minetab.getAttribute('data-minetab'); render(); return; }
    var person = e.target.closest('[data-person]');
    if (person) { S.memberUserId = person.getAttribute('data-person'); go('member'); return; }
    var edit = e.target.closest('[data-edit]');
    if (edit) {
      var editId = edit.getAttribute('data-edit');
      // タスク全件がまだ裏で読み込み中のときに開くと、見つからず「新規作成」と誤認してしまう。
      // それを防ぎ、読み込み待ちであることを伝える
      if (S.items === null) { toast('タスクを読み込んでいます。少し待ってからもう一度お試しください'); return; }
      if (!itemById(editId)) { toast('そのタスクは見つかりませんでした', true); return; }
      openTaskEditor(editId, null);
      return;
    }
    var add = e.target.closest('[data-add]');
    if (add) { openTaskEditor(null, add.getAttribute('data-add')); return; }
    var sub = e.target.closest('[data-addsub]');
    if (sub) { openSubTaskEditor(sub.getAttribute('data-addsub')); return; }
    var tg = e.target.closest('[data-toggle]');
    if (tg) { var k = tg.getAttribute('data-toggle'); S.collapsed[k] = !S.collapsed[k]; render(); return; }
    var pgtoggle = e.target.closest('[data-pgtoggle]');
    if (pgtoggle) { var pk = pgtoggle.getAttribute('data-pgtoggle'); S.portfolioOpen[pk] = !S.portfolioOpen[pk]; render(); return; }
    var petoggle = e.target.closest('[data-petoggle]');
    if (petoggle) { var pek = petoggle.getAttribute('data-petoggle'); S.peopleGanttOpen = S.peopleGanttOpen || {}; S.peopleGanttOpen[pek] = !S.peopleGanttOpen[pek]; render(); return; }
    var tplPick = e.target.closest('[data-tplpick]');
    if (tplPick) { S.tplSelected = tplPick.getAttribute('data-tplpick'); render(); return; }
  });

  $('btn-bell').addEventListener('click', function () { go('notifications'); });

  function go(view, opts) {
    S.view = view;
    if (view !== 'detail') S.projectId = null;
    renderNav();
    render();
    window.scrollTo(0, 0);
    if (!(opts && opts.silent)) pushUrl();
  }

  // ---------------------------------------------------------------- URL（直接アクセス）
  /**
   * 画面を切り替えるたびにURLを書き換える。ページは再読み込みしない。
   * GAS のウェブアプリは iframe の中なので、URLの操作は google.script.history を使う。
   * これが無い環境（ローカルで開いたときなど）では何もしない。
   */
  function pushUrl() {
    var params = { p: S.view };
    if (S.view === 'detail' && S.projectId) params.id = S.projectId;
    try {
      if (window.google && google.script && google.script.history) {
        google.script.history.replace(null, params);
      }
    } catch (e) { /* URLを書けなくても画面は動く */ }
  }

  /**
   * 起動時にURLで指定された画面を開く。
   * **URLの値は信用しない。** 実在しないIDなら一覧に落とし、その旨を伝える。
   */
  function applyInitialRoute() {
    var r = (typeof INITIAL_ROUTE === 'object' && INITIAL_ROUTE) ? INITIAL_ROUTE : { page: 'projects', id: '' };
    var page = r.page || 'projects';

    if (page === 'detail' || page === 'task') {
      if (!r.id) { go('projects', { silent: true }); return; }
      if (page === 'detail') {
        if (!project(r.id)) {
          toast('そのプロジェクトは見つかりませんでした', true);
          go('projects', { silent: true });
          return;
        }
        S.projectId = r.id;
        go('detail', { silent: true });
        return;
      }
      // ?p=task&id=… はタスクの編集を開いた状態にする。タスクを読み終えてから開く
      pendingTaskId = r.id;
      go('projects', { silent: true });
      return;
    }
    go(page, { silent: true });
  }

  /** ?p=task&id=… で指定されたタスク。getItems() が終わってから開く */
  var pendingTaskId = null;
  function openPendingTask() {
    if (!pendingTaskId) return;
    var id = pendingTaskId;
    pendingTaskId = null;
    var it = itemById(id);
    if (!it) { toast('そのタスクは見つかりませんでした', true); return; }
    S.projectId = it.project_id;
    go('detail', { silent: true });
    openTaskEditor(id, null);
  }

  /** いまの画面を指すURLを作る（「このページのリンクをコピー」で使う） */
  function currentUrl(cb) {
    try {
      google.script.url.getLocation(function (loc) {
        var base = loc.url || '';
        var q = '?p=' + encodeURIComponent(S.view) +
          (S.view === 'detail' && S.projectId ? '&id=' + encodeURIComponent(S.projectId) : '');
        cb(base.split('?')[0] + q);
      });
    } catch (e) { cb(''); }
  }

  // ---------------------------------------------------------------- 描画
  function render() {
    var m = $('main');
    if (S.view === 'projects') m.innerHTML = viewProjects();
    else if (S.view === 'detail') m.innerHTML = viewDetail();
    else if (S.view === 'member') m.innerHTML = viewMember();
    else if (S.view === 'mine') m.innerHTML = viewMine();
    else if (S.view === 'people') m.innerHTML = viewPeople();
    else if (S.view === 'search') m.innerHTML = viewSearch();
    else if (S.view === 'new') m.innerHTML = viewNew();
    else if (S.view === 'templates') { m.innerHTML = '<div class="loading">読み込んでいます…</div>'; loadTemplatesView(); }
    else if (S.view === 'settings') m.innerHTML = viewSettings();
    else if (S.view === 'rules') m.innerHTML = viewRules();
    else if (S.view === 'notifications') { m.innerHTML = '<div class="loading">読み込んでいます…</div>'; loadNotifications(); }
    wireInputs();
  }

  function loadingNote() {
    return S.items === null
      ? '<div class="empty">タスクを読み込んでいます…</div>' : '';
  }

  function badge(h) {
    return '<span class="badge ' + h + '"><span aria-hidden="true">' + H.HEALTH_ICON[h] + '</span>' + H.HEALTH_LABEL[h] + '</span>';
  }
  function typeChip(t) {
    var cls = t === 'bug' ? ' bug' : (t === 'req' ? ' req' : '');
    return '<span class="chip' + cls + '">' + (H.TYPE_LABEL[t] || '作業') + '</span>';
  }
  function progBar(calc) {
    var a = Math.round((calc.actualRate || 0) * 100);
    var marker = calc.plannedRate === null || calc.plannedRate === undefined ? ''
      : '<span class="planned" style="left:' + (calc.plannedRate * 100).toFixed(1) + '%"></span>';
    return '<div class="prog-wrap"><div class="prog ' + calc.health + '">' +
      '<div class="fill" style="width:' + a + '%"></div>' + marker + '</div>' +
      '<span class="pct">' + a + '%</span></div>';
  }
  function dueText(calc) {
    if (calc.health === 'done') return '<span class="faint">済み</span>';
    if (calc.remainingDays === null) return '<span class="faint">—</span>';
    if (calc.overDays > 0) return '<span class="late">超過+' + calc.overDays + '日</span>';
    if (calc.remainingDays === 0) return '<span class="late">今日期限</span>';
    if (calc.remainingDays < 0) return '<span class="faint">—</span>';
    return '<span class="num faint">あと ' + calc.remainingDays + ' 日</span>';
  }
  function periodText(s, e) {
    if (!s || !e) return '<span class="faint">期間未設定</span>';
    return '<span class="num">' + H.formatDate(s) + ' 〜 ' + H.formatDate(e) + '</span> <span class="faint">' + H.durationDays(s, e) + '日</span>';
  }
  function assignee(id) {
    return id ? '<span class="who">' + esc(userName(id)) + '</span>' : '<span class="who none">未アサイン</span>';
  }

  /* ================================================================
   * ガント（②全プロジェクト／⑥1プロジェクト内／⑫担当者別で共通）
   * モックの assets/gantt.js を、この画面の関数名に合わせて移植したもの。
   * 月の帯＋週または月の目盛り＋今日線。各行は1本のバーで、中を進捗率ぶん濃く塗る。
   * ================================================================ */

  /** 日付軸。scale: 'week' 週（月曜）ごと／'month' 月の1日ごと。未指定は期間の長さで自動 */
  function ganttAxis(min, max, today, scale) {
    var span = H.diffDays(min, max) + 1;
    var pos = function (iso) { return (H.diffDays(min, iso) / span) * 100; };
    if (scale !== 'week' && scale !== 'month') scale = span <= 120 ? 'week' : 'month';

    var months = [];
    var cur = min.slice(0, 8) + '01';
    while (cur <= max) {
      var d = H.parse(cur);
      var nextIso = H.toISO(new Date(d.getFullYear(), d.getMonth() + 1, 1));
      var from = cur < min ? min : cur;
      var to = nextIso > max ? max : H.addDays(nextIso, -1);
      months.push({
        label: (d.getMonth() === 0 ? d.getFullYear() + '年 ' : '') + (d.getMonth() + 1) + '月',
        left: pos(from), width: ((H.diffDays(from, to) + 1) / span) * 100, odd: months.length % 2 === 1
      });
      cur = nextIso;
    }

    var ticks = [];
    if (scale === 'week') {
      var dow = H.parse(min).getDay();
      var first = H.addDays(min, (8 - (dow === 0 ? 7 : dow)) % 7);
      for (var iso = first; iso <= max; iso = H.addDays(iso, 7)) {
        var d1 = H.parse(iso);
        ticks.push({ left: pos(iso), label: (d1.getMonth() + 1) + '/' + d1.getDate() });
      }
    } else {
      var cur2 = min.slice(0, 8) + '01';
      if (cur2 < min) cur2 = H.toISO(new Date(H.parse(cur2).getFullYear(), H.parse(cur2).getMonth() + 1, 1));
      for (; cur2 <= max; cur2 = H.toISO(new Date(H.parse(cur2).getFullYear(), H.parse(cur2).getMonth() + 1, 1))) {
        var d2 = H.parse(cur2);
        ticks.push({ left: pos(cur2), label: (d2.getMonth() + 1) + '/' + d2.getDate() });
      }
    }
    return { span: span, pos: pos, months: months, ticks: ticks, scale: scale,
      todayPos: (today >= min && today <= max) ? pos(today) : null };
  }

  function ganttGridLines(axis) {
    var out = axis.ticks.map(function (t) { return '<div class="g-line" style="left:' + t.left.toFixed(2) + '%"></div>'; });
    axis.months.forEach(function (m, i) {
      if (i > 0) out.push('<div class="g-line month" style="left:' + m.left.toFixed(2) + '%"></div>');
    });
    return out.join('');
  }

  /**
   * @param rows [{ name, level, startDate, endDate, calc, href(またはdataEdit), tag, metaHtml, itemType, itemKey,
   *               kind:'group'|'sub'(まとめ行), open, badgeHtml, attrs }]
   * @param opt  { today, labelHead, emptyText, scale }
   */
  function ganttHtml(rows, opt) {
    opt = opt || {};
    var today = opt.today || S.today;
    var emptyHtml = '<div class="empty">' + esc(opt.emptyText || '期間の入ったタスクがありません') + '</div>';
    if (!rows.length) return emptyHtml;

    var dated = rows.filter(function (r) { return r.startDate && r.endDate; });
    if (!dated.length) return emptyHtml;

    var min = null, max = null;
    dated.forEach(function (r) {
      if (!min || r.startDate < min) min = r.startDate;
      if (!max || r.endDate > max) max = r.endDate;
    });
    if (today < min) min = today;
    if (today > max) max = today;
    // 右側は少し広めに取る（バーを後ろへずらす余地を残す）
    min = H.addDays(min, -3);
    max = H.addDays(max, 10);

    var axis = ganttAxis(min, max, today, opt.scale);
    var lines = ganttGridLines(axis);
    var todayLine = axis.todayPos === null ? '' : '<div class="g-today" style="left:' + axis.todayPos.toFixed(2) + '%"></div>';

    var head = '<div class="g-head">' +
      '<div class="g-headlabel">' + esc(opt.labelHead || 'タスク（期間）') + '</div>' +
      '<div class="g-axis"><div class="g-months">' +
        (axis.todayPos === null ? '' : '<span class="g-todaytag" style="left:' + axis.todayPos.toFixed(2) + '%">今日 ' + esc(H.formatDate(today)) + '</span>') +
        axis.months.map(function (m) {
          return '<div class="g-month' + (m.odd ? ' odd' : '') + '" style="left:' + m.left.toFixed(2) + '%;width:' + m.width.toFixed(2) + '%">' + esc(m.label) + '</div>';
        }).join('') + '</div>' +
      '<div class="g-ticks">' + lines + axis.ticks.map(function (t) {
        return '<span class="g-tick" style="left:' + t.left.toFixed(2) + '%">' + esc(t.label) + '</span>';
      }).join('') + todayLine + '</div></div></div>';

    var widthOf = function (a, b) { return Math.max(0.6, ((H.diffDays(a, b) + 1) / axis.span) * 100); };

    var body = rows.map(function (r) {
      var c = r.calc || {};
      var nameHtml =
        (r.itemType ? typeChip(r.itemType) + ' ' : '') +
        (r.itemKey ? '<span class="faint" style="flex-shrink:0;font-size:13px">' + esc(r.itemKey) + '</span> ' : '') +
        (r.href ? '<a class="link" href="javascript:void(0)" data-edit="' + esc(r.href) + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r.name) + '</a>'
                : '<span class="txt">' + esc(r.name) + '</span>');

      if (r.kind === 'group' || r.kind === 'sub') {
        var span = (r.startDate && r.endDate)
          ? '<div class="g-span ' + (c.health || '') + (r.dragProject ? ' g-grab' : '') + '" style="left:' + axis.pos(r.startDate).toFixed(2) + '%;width:' + widthOf(r.startDate, r.endDate).toFixed(2) + '%"' +
            (r.dragProject ? ' data-gbar="project:' + esc(r.dragProject) + '" data-s="' + esc(r.startDate) + '" data-e="' + esc(r.endDate) + '"' : '') +
            ' title="' + esc(H.formatDate(r.startDate) + ' 〜 ' + H.formatDate(r.endDate)) + '"></div>' : '';
        return '<div class="g-row g-' + r.kind + '"' + (r.attrs || '') + '>' +
          '<div class="g-label"><div class="g-name">' +
            (r.kind === 'group' ? '<span class="g-caret" aria-hidden="true">' + (r.open ? '▾' : '▸') + '</span>' : '') +
            nameHtml + (r.badgeHtml || '') + '</div>' +
            (r.metaHtml ? '<div class="g-dates">' + r.metaHtml + '</div>' : '') + '</div>' +
          '<div class="g-track">' + lines + span + todayLine + '</div></div>';
      }

      var meta = r.metaHtml !== undefined ? r.metaHtml
        : (periodText(r.startDate, r.endDate) + (r.startDate && r.endDate ? ' ・ ' + dueText(c) : '') + (r.tag ? ' ・ ' + esc(r.tag) : ''));

      var label = '<div class="g-label"><div class="g-name">' + nameHtml +
        (c.health === 'delayed' ? ' <span class="badge delayed" style="padding:2px 9px;font-size:12px"><span aria-hidden="true">!</span>遅延</span>' : '') +
        '</div><div class="g-dates">' + meta + '</div></div>';

      if (!r.startDate || !r.endDate) {
        return '<div class="g-row lv' + (r.level || 1) + '">' + label + '<div class="g-track">' + lines + todayLine + '</div></div>';
      }

      var width = Math.max(0.6, ((H.diffDays(r.startDate, r.endDate) + 1) / axis.span) * 100);
      var done = Math.round((c.actualRate || 0) * 100);
      var canDrag = !!r.href;   // タスクの行だけ。まとめ行は動かさない
      var bar = '<div class="g-bar ' + (c.health || 'not_started') + (canDrag ? ' g-grab' : '') + '" style="left:' + axis.pos(r.startDate).toFixed(2) + '%;width:' + width.toFixed(2) + '%"' +
        (canDrag ? ' data-gbar="item:' + esc(r.href) + '" data-edit="' + esc(r.href) + '" data-s="' + esc(r.startDate) + '" data-e="' + esc(r.endDate) + '"' : '') +
        ' title="' + esc(H.formatDate(r.startDate) + ' 〜 ' + H.formatDate(r.endDate) + '（進捗 ' + done + '%）') + '">' +
        (canDrag ? '<span class="g-h l" aria-hidden="true"></span><span class="g-h r" aria-hidden="true"></span>' : '') +
        '<span class="g-rest" style="width:' + (100 - done) + '%"></span>' +
        (width > 6 ? '<span class="g-pct">' + done + '%</span>' : '') + '</div>';

      return '<div class="g-row lv' + (r.level || 1) + '">' + label + '<div class="g-track">' + lines + bar + todayLine + '</div></div>';
    }).join('');

    return '<div class="gantt-scroll"><div class="gantt" data-min="' + esc(min) + '" data-span="' + axis.span + '">' + head + '<div class="g-rows">' + body + '</div></div></div>';
  }

  function ganttLegend() {
    return '<div class="gantt-legend">' +
      '<span><i style="background:var(--h-on-track)"></i>濃い部分＝進んだぶん</span>' +
      '<span><i style="background:var(--h-on-track);opacity:.28"></i>薄い部分＝残り</span>' +
      '<span><i style="width:2px;background:var(--today-line)"></i>今日</span>' +
      '<span>目盛りの数字＝その線の日付（週表示は月曜、月表示は1日）</span>' +
      '<span>バーの色＝状態（緑 対応中／赤 遅延／青 完了／灰 開始前）</span>' +
      '<span class="gantt-howto">バーを左右に動かす＝日程をずらす・端を動かす＝開始日／終了日を変える（タッチは長押ししてから）</span></div>';
  }

  // ---- ① プロジェクト一覧 ----
  function viewProjects() {
    var delayedTasks = 0, pjWithDelay = 0, open = 0, notStarted = 0, done = 0;
    S.projects.forEach(function (p) {
      var c = S.summary[p.project_id] || {};
      if (c.delayed_count > 0) { delayedTasks += c.delayed_count; pjWithDelay++; }
      if (c.health === 'not_started') notStarted++;
      else if (c.health === 'done' || p.status === 'done') done++;
      else open++;
    });

    var HR = { delayed: 0, no_period: 1, on_track: 2, not_started: 3, done: 4 };
    var shown = S.projects.filter(function (p) {
      var c = S.summary[p.project_id] || {};
      if (!S.pf.done && (p.status === 'done' || c.health === 'done')) return false;
      if (S.pf.health && c.health !== S.pf.health) return false;
      if (S.pf.owner && p.owner_user_id !== S.pf.owner) return false;
      if (S.pf.tpl === '@none' ? !!p.template_id : (S.pf.tpl && p.template_id !== S.pf.tpl)) return false;
      return true;
    });

    var rows = shown.slice().sort(function (a, b) {
      var ca = S.summary[a.project_id] || {}, cb = S.summary[b.project_id] || {};
      if (S.pf.sort === 'name') return String(a.name).localeCompare(String(b.name), 'ja');
      if (S.pf.sort === 'due') return String(a.end_date || '9999').localeCompare(String(b.end_date || '9999'));
      var d = (HR[ca.health] === undefined ? 9 : HR[ca.health]) - (HR[cb.health] === undefined ? 9 : HR[cb.health]);
      return d !== 0 ? d : (cb.delayed_count || 0) - (ca.delayed_count || 0);
    }).map(function (p) {
      var c = S.summary[p.project_id] || { health: 'no_period', actual_rate: 0, planned_rate: 0, delayed_count: 0 };
      var calc = {
        actualRate: (c.actual_rate || 0) / 100,
        plannedRate: (c.planned_rate || 0) / 100,
        health: c.health || 'no_period',
        remainingDays: p.end_date ? H.diffDays(S.today, p.end_date) : null,
        overDays: 0
      };
      if (calc.remainingDays !== null && calc.remainingDays < 0 && p.status !== 'done') calc.overDays = -calc.remainingDays;
      return '<tr>' +
        '<td><div class="cell"><a class="t" data-project="' + esc(p.project_id) + '">' + esc(p.name) + '</a>' +
          '<span class="s">' + esc(p.key) + ' ・ ' + esc(p.template_name || 'テンプレートなし') +
          (c.delayed_count > 0 ? ' ・ <span class="late">配下の遅延 ' + c.delayed_count + '件</span>' : '') + '</span></div></td>' +
        '<td>' + badge(calc.health) + '</td>' +
        '<td>' + progBar(calc) + '</td>' +
        '<td class="col-hide">' + dueText(calc) + '</td>' +
        '<td class="col-hide"><span class="who">' + esc(userName(p.owner_user_id)) + '</span></td>' +
      '</tr>';
    }).join('');

    var tabs = '<div class="tabs">' +
        '<button data-ptab="list"' + (S.projectsTab !== 'gantt' ? ' class="active"' : '') + '>一覧</button>' +
        '<button data-ptab="gantt"' + (S.projectsTab === 'gantt' ? ' class="active"' : '') + '>ガント</button>' +
      '</div>';

    var pageHead = head('プロジェクト一覧',
        delayedTasks ? '<span class="late">遅延しているタスクが ' + delayedTasks + ' 件</span>あります（' + pjWithDelay + ' プロジェクト）'
                     : '遅れているタスクはありません',
        '<button class="btn primary" data-nav="new">＋ プロジェクトを作成</button>');

    if (S.projectsTab === 'gantt') return pageHead + tabs + portfolioGanttBody();

    return pageHead + tabs +
      '<div class="toolbar">' +
        '<span class="label">状態</span><select class="inline" id="f-health">' +
          optionList([['', 'すべて'], ['delayed', '遅延'], ['on_track', '対応中'],
                      ['not_started', '開始前'], ['done', '完了']], S.pf.health) + '</select>' +
        '<span class="label">オーナー</span><select class="inline" id="f-owner">' +
          optionList([['', 'すべて']].concat(S.users.map(function (u) { return [u.user_id, u.name]; })), S.pf.owner) + '</select>' +
        '<span class="label">テンプレート</span><select class="inline" id="f-tpl">' +
          optionList([['', 'すべて'], ['@none', 'テンプレートなし']].concat(
            S.templates.map(function (t) { return [t.template_id, t.name]; })), S.pf.tpl) + '</select>' +
        '<span class="label">並び順</span><select class="inline" id="f-sort">' +
          optionList([['delayed', '遅延している順'], ['due', '期限が近い順'], ['name', '名前順']], S.pf.sort) + '</select>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="f-done"' +
          (S.pf.done ? ' checked' : '') + '> 完了も表示</label>' +
        '<span class="spacer"></span><span class="count">' + rows.length + ' / ' + S.projects.length + ' 件</span></div>' +
      '<section class="card"><div class="tbl-wrap">' +
        (rows.length
          ? '<table class="tbl"><colgroup><col><col style="width:128px"><col style="width:190px">' +
            '<col class="col-hide" style="width:128px"><col class="col-hide" style="width:140px"></colgroup>' +
            '<thead><tr><th>プロジェクト</th><th>状態</th><th>進捗</th>' +
            '<th class="col-hide">期限まで</th><th class="col-hide">オーナー</th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<div class="empty">' + (S.projects.length
              ? '条件に合うプロジェクトがありません'
              : 'プロジェクトがありません。「＋ プロジェクトを作成」から作ってください') + '</div>') +
      '</div></section>';
  }

  /** ② 全プロジェクトのガント：行はプロジェクトの期間をまとめた帯。開くと配下のタスクが出る */
  function portfolioGanttBody() {
    if (S.items === null) {
      return '<div class="toolbar"><span class="spacer"></span></div><div class="empty">タスクを読み込んでいます…</div>';
    }
    var shown = S.projects.filter(function (p) {
      if (!S.portfolioShowDone && p.status === 'done') return false;
      if (S.portfolioOwner && p.owner_user_id !== S.portfolioOwner) return false;
      return true;
    });

    var rows = [];
    shown.forEach(function (p) {
      var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
      var c = tree.calc;
      var open = !!S.portfolioOpen[p.project_id];
      rows.push({
        kind: 'group', name: p.key + ' ' + p.name, open: open,
        startDate: p.start_date, endDate: p.end_date, calc: c, dragProject: p.project_id,
        attrs: ' data-pgtoggle="' + esc(p.project_id) + '"',
        badgeHtml: ' ' + badge(c.health) + (c.delayedInside > 0 ? ' <span class="late">配下 ' + c.delayedInside + '</span>' : ''),
        metaHtml: periodText(p.start_date, p.end_date) + ' ・ 進捗 ' + H.pct(c.actualRate) +
          ' ・ <a class="link" href="javascript:void(0)" data-project="' + esc(p.project_id) + '">プロジェクトを開く</a>'
      });
      if (open) {
        tree.children.forEach(function (t) {
          rows.push({ name: t.node.name, itemType: t.node.item_type, itemKey: t.node.item_key, level: 1,
            startDate: t.node.start_date, endDate: t.node.end_date, calc: t.calc, href: t.node.item_id, tag: userName(t.node.assignee_user_id) });
        });
      }
    });

    return '<div class="toolbar">' +
        '<span class="label">目盛り</span>' +
        '<select class="inline" id="pg-scale">' + optionList([['week', '週'], ['month', '月']], S.portfolioScale || 'month') + '</select>' +
        '<span class="label">オーナー</span>' +
        '<select class="inline" id="pg-owner">' + optionList([['', 'すべて']].concat(S.users.map(function (u) { return [u.user_id, u.name]; })), S.portfolioOwner) + '</select>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="pg-done"' + (S.portfolioShowDone ? ' checked' : '') + '> 完了も表示</label>' +
        '<span class="spacer"></span><span class="count">プロジェクト ' + shown.length + ' 件</span>' +
      '</div>' +
      '<p class="help" style="margin:0 0 10px">行をクリックすると開き、配下のタスクが出ます</p>' +
      '<section class="card"><div class="tbl-wrap">' +
        ganttHtml(rows, { today: S.today, scale: S.portfolioScale, labelHead: 'プロジェクト（期間）', emptyText: '条件に合うプロジェクトがありません' }) +
      '</div>' +
        '<div class="card-body" style="border-top:1px solid var(--border);padding:12px 20px">' + ganttLegend() + '</div></section>';
  }

  function head(title, sub, actions) {
    return '<div class="page-head"><div style="min-width:0">' +
      '<h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') +
      '</div><span class="spacer"></span>' + (actions || '') + '</div>';
  }

  // ---- ③ プロジェクト詳細 ----
  var DETAIL_TABS = [
    { k: 'overview', label: '概要' },
    { k: 'board', label: 'ボード' },
    { k: 'list', label: 'リスト' },
    { k: 'gantt', label: 'ガント' },
    { k: 'settings', label: '設定' }
  ];

  function viewDetail() {
    var p = project(S.projectId);
    if (!p) return '<div class="empty">プロジェクトが見つかりません</div>';
    var tab = DETAIL_TABS.some(function (t) { return t.k === S.tab; }) ? S.tab : 'overview';

    var crumb = '<div class="breadcrumb"><a data-nav="projects">プロジェクト一覧</a> ／ ' + esc(p.name) + '</div>';
    var pageHead = head(p.name, esc(p.key) + ' ・ ' + esc(p.template_name || 'テンプレートなし') + ' ・ ' + esc(userName(p.owner_user_id)),
      tab === 'settings' ? '' : '<button class="btn primary" data-add="' + esc(p.project_id) + '">＋ タスクを追加</button>');
    var tabsHtml = '<div class="tabs">' + DETAIL_TABS.map(function (t) {
      return '<button data-tab="' + t.k + '"' + (t.k === tab ? ' class="active"' : '') + '>' + t.label + '</button>';
    }).join('') + '</div>';

    if (S.items === null && tab !== 'settings') {
      return crumb + pageHead + tabsHtml + '<div class="empty">タスクを読み込んでいます…</div>';
    }

    var body;
    if (tab === 'settings') body = projectSettings(p);
    else if (tab === 'board') body = projectBoard(p);
    else if (tab === 'list') body = projectList(p);
    else if (tab === 'gantt') body = projectGantt(p);
    else body = projectOverview(p);

    return crumb + pageHead + tabsHtml + body;
  }

  /** ③ 概要：ツリー表示 */
  function projectOverview(p) {
    var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
    var c = tree.calc;
    var subTotal = 0, subDone = 0;
    tree.children.forEach(function (t) { subTotal += t.children.length; subDone += t.calc.doneCount; });

    var rows = '';
    tree.children.forEach(function (t) {
      var kids = t.children.filter(function (s) { return !S.df.delayedOnly || s.calc.health === 'delayed'; });
      if (S.df.delayedOnly && t.calc.health !== 'delayed' && !kids.length) return;
      rows += treeRow(t, 1, t.children.length > 0);
      if (!S.collapsed[t.node.item_id]) kids.forEach(function (s) { rows += treeRow(s, 2, false); });
    });
    var anyOpen = tree.children.some(function (t) { return !S.collapsed[t.node.item_id]; });

    return '<div class="toolbar">' +
        '<span class="label">進捗</span><span class="count">' + H.pct(c.actualRate) + '</span>' +
        '<span class="label">予定</span><span class="count">' + H.pct(c.plannedRate) + '（参考）</span>' +
        '<span class="label">期限まで</span><span class="count">' + dueText(c) + '</span>' +
        '<span class="spacer"></span>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="d-delayed"' +
          (S.df.delayedOnly ? ' checked' : '') + '> 遅延だけ表示</label>' +
        '<button class="btn sm" id="d-toggle">' + (anyOpen ? 'すべて折りたたむ' : 'すべて開く') + '</button>' +
        '<span class="count">タスク ' + c.doneCount + ' / ' + c.childCount + ' 完了（子 ' + subDone + ' / ' + subTotal + '）</span>' +
      '</div>' +
      customFieldsCard(p) +
      '<section class="card"><div class="tbl-wrap">' +
        '<div class="tree-row head"><div>タスク</div><div>状態</div><div class="col-hide">進捗</div>' +
        '<div class="col-hide">担当</div><div class="col-hide">期限</div></div>' +
        (rows || '<div class="empty">タスクがありません</div>') +
      '</div></section>';
  }

  /** ④ ボード：ステータス4列にドラッグでカードを移す */
  function projectBoard(p) {
    var items = itemsOf(p.project_id);
    var filtered = S.boardAssignee ? items.filter(function (x) { return x.assignee_user_id === S.boardAssignee; }) : items;

    var cols = H.STATUS_ORDER.map(function (st) {
      var list = filtered.filter(function (x) { return x.status === st; });
      var cards = list.map(function (x) {
        var kidsCalc = itemsOf(p.project_id).filter(function (k) { return k.parent_item_id === x.item_id; })
          .map(function (k) { return { node: k, calc: H.evaluate(k, [], S.today) }; });
        var calc = H.evaluate(x, kidsCalc, S.today);
        var parent = x.parent_item_id ? itemById(x.parent_item_id) : null;
        return '<div class="tcard" data-drag="' + esc(x.item_id) + '" data-edit="' + esc(x.item_id) + '">' +
          '<div class="top">' + typeChip(x.item_type) +
            '<span class="faint" style="font-size:12px">' + esc(x.item_key) + '</span>' +
            '<span class="spacer"></span>' + badge(calc.health) + '</div>' +
          '<span class="t">' + esc(x.name) + '</span>' +
          (parent ? '<div class="faint" style="font-size:12px;margin:-4px 0 8px">└ ' + esc(parent.name) + '</div>' : '') +
          '<div class="foot">' + assignee(x.assignee_user_id) + '<span class="spacer"></span>' + dueText(calc) + '</div>' +
          '<div style="margin-top:8px">' + progBar(calc) + '</div>' +
        '</div>';
      }).join('');
      return '<div class="board-col" data-dropcol="' + st + '">' +
        '<div class="board-col-head">' + H.STATUS_LABEL[st] + '<span class="n">' + list.length + '</span></div>' +
        '<div class="board-col-body">' + (cards || '<div class="empty" style="padding:16px 8px;font-size:13px">なし</div>') + '</div></div>';
    }).join('');

    return '<div class="toolbar">' +
        '<span class="label">担当者</span>' +
        '<select class="inline" id="bd-assignee">' +
          optionList([['', 'すべて']].concat(S.users.map(function (u) { return [u.user_id, u.name]; })), S.boardAssignee || '') +
        '</select>' +
        '<span class="spacer"></span><span class="count">タスク ' + filtered.length + ' 件</span>' +
      '</div>' +
      '<p class="help" style="margin:0 0 10px">カードを別の列へ動かすとステータスが変わります（タッチは長押ししてから）</p>' +
      '<div class="board-wrap"><div class="board">' + cols + '</div></div>';
  }

  /** ⑤ リスト：まとめ方を切り替えて表で見る */
  function projectList(p) {
    var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
    var flat = H.flatten(tree);
    var mode = S.listGroupBy || 'status';

    var groups;
    if (mode === 'status') {
      groups = H.STATUS_ORDER.map(function (st) {
        return { label: H.STATUS_LABEL[st], rows: flat.filter(function (r) { return r.node.status === st; }) };
      });
    } else if (mode === 'assignee') {
      groups = S.users.map(function (u) {
        return { label: u.name, rows: flat.filter(function (r) { return r.node.assignee_user_id === u.user_id; }) };
      }).concat([{ label: '未アサイン', rows: flat.filter(function (r) { return !r.node.assignee_user_id; }) }]);
    } else {
      groups = ['work', 'bug', 'req'].map(function (t) {
        return { label: H.TYPE_LABEL[t], rows: flat.filter(function (r) { return r.node.item_type === t; }) };
      });
    }
    groups = groups.filter(function (g) { return g.rows.length; });

    var body = groups.map(function (g) {
      return '<div style="padding:9px 20px;background:var(--surface-2);border-bottom:1px solid var(--border);' +
          'font-size:13px;font-weight:700;color:var(--text-muted)">' + esc(g.label) + '<span class="faint" style="font-weight:400;margin-left:6px">' + g.rows.length + '</span></div>' +
        '<table class="tbl"><colgroup><col><col style="width:170px"><col style="width:150px">' +
          '<col style="width:132px"><col style="width:120px"></colgroup><tbody>' +
        g.rows.map(function (r) {
          var n = r.node, calc = r.calc;
          var parent = n.parent_item_id ? itemById(n.parent_item_id) : null;
          return '<tr>' +
            '<td><div class="cell">' + typeChip(n.item_type) +
              ' <a class="link" href="javascript:void(0)" data-edit="' + esc(n.item_id) + '" style="display:inline">' + esc(n.name) + '</a>' +
              '<span class="s">' + esc(n.item_key) + (parent ? ' ・ └ ' + esc(parent.name) : '') + '</span></div></td>' +
            '<td class="col-hide">' + periodText(n.start_date, n.end_date) + '</td>' +
            '<td>' + progBar(calc) + '</td>' +
            '<td class="col-hide">' + dueText(calc) + '</td>' +
            '<td>' + badge(calc.health) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).join('');

    return '<div class="toolbar">' +
        '<span class="label">まとめ方</span>' +
        '<select class="inline" id="ls-group">' +
          optionList([['status', 'ステータス'], ['assignee', '担当者'], ['type', '種別']], mode) +
        '</select>' +
        '<span class="spacer"></span><span class="count">タスク ' + flat.length + ' 件</span>' +
      '</div>' +
      '<section class="card"><div class="tbl-wrap">' + (body || '<div class="empty">タスクがありません</div>') + '</div></section>';
  }

  /** ⑥ ガント：1プロジェクト内のタスクを時間軸で見る */
  function projectGantt(p) {
    var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
    var showDone = S.ganttShowDone !== false;
    var rows = [];
    tree.children.forEach(function (t) {
      if (showDone || t.node.status !== 'done') {
        rows.push({ name: t.node.name, itemType: t.node.item_type, itemKey: t.node.item_key, level: 1,
          startDate: t.node.start_date, endDate: t.node.end_date, calc: t.calc, href: t.node.item_id, tag: userName(t.node.assignee_user_id) });
      }
      t.children.forEach(function (s) {
        if (showDone || s.node.status !== 'done') {
          rows.push({ name: s.node.name, itemType: s.node.item_type, itemKey: s.node.item_key, level: 2,
            startDate: s.node.start_date, endDate: s.node.end_date, calc: s.calc, href: s.node.item_id, tag: userName(s.node.assignee_user_id) });
        }
      });
    });

    return '<div class="toolbar">' +
        '<span class="label">目盛り</span>' +
        '<select class="inline" id="gt-scale">' + optionList([['week', '週'], ['month', '月']], S.ganttScale || 'week') + '</select>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="gt-done"' + (showDone ? ' checked' : '') + '> 完了も表示</label>' +
        '<span class="spacer"></span><span class="count">タスク ' + rows.length + ' 件</span>' +
      '</div>' +
      '<section class="card"><div class="tbl-wrap">' + ganttHtml(rows, { today: S.today, scale: S.ganttScale, labelHead: 'タスク（期間）' }) + '</div>' +
        '<div class="card-body" style="border-top:1px solid var(--border);padding:12px 20px">' + ganttLegend() + '</div></section>';
  }

  /* テンプレートの項目定義を覚えておく。表示のたびに読みに行かないため */
  /** 概要に出すときの値の見せ方（型に合わせる） */
  function fieldDisplay(d, v) {
    if (d.type === 'checkbox') return v === true ? 'はい' : 'いいえ';
    if (d.type === 'date') return H.formatDate(String(v));
    if (d.type === 'number' && typeof v === 'number') return v.toLocaleString('ja-JP');
    return String(v);
  }

  /** 概要に設定項目を出す。値が1つも無いときは出さない（空のカードを並べない） */
  function customFieldsCard(p) {
    var cf = p.custom_fields || {};
    var defs = (p.field_defs || []).filter(function (d) {
      var v = cf[d.key];
      if (d.type === 'checkbox') return v === true;
      return v !== '' && v !== null && v !== undefined;
    });
    if (!defs.length) return '';
    return '<section class="card"><div class="card-head"><h2>設定項目</h2>' +
        '<span class="spacer"></span><button class="btn sm" data-tab="settings">編集</button></div>' +
      '<div class="card-body"><dl class="fe-dl">' +
        defs.map(function (d) {
          return '<dt class="faint">' + esc(d.label) + '</dt><dd>' + esc(fieldDisplay(d, cf[d.key])) + '</dd>';
        }).join('') +
      '</dl></div></section>';
  }

  function treeRow(n, level, hasKids) {
    var node = n.node, calc = n.calc;
    return '<div class="tree-row lv' + level + '">' +
      '<div class="name">' +
        (level === 1
          ? '<button class="toggle" data-toggle="' + esc(node.item_id) + '" aria-label="開閉">' +
            (hasKids ? (S.collapsed[node.item_id] ? '▸' : '▾') : '') + '</button>'
          : '') +
        typeChip(node.item_type) +
        '<span class="link" data-edit="' + esc(node.item_id) + '">' + esc(node.name) + '</span>' +
        (calc.delayedInside > 0 ? ' <span class="late">配下 ' + calc.delayedInside + '</span>' : '') +
        (level === 1
          ? ' <a class="add-sub" data-addsub="' + esc(node.item_id) + '" title="このタスクの下に子タスクを作る">＋ 子タスク</a>'
          : '') +
      '</div>' +
      '<div>' + badge(calc.health) + '</div>' +
      '<div class="col-hide">' + progBar(calc) + '</div>' +
      '<div class="col-hide">' + assignee(node.assignee_user_id) + '</div>' +
      '<div class="col-hide">' + dueText(calc) + '</div>' +
    '</div>';
  }

  // ---- ⑭ マイタスク ----
  var DUE_LABEL = { delayed: '遅延', today: '今日期限', week: '今週', later: '以降', done: '完了済み' };
  function dueGroup(node, calc) {
    if (node.status === 'done') return 'done';
    if (!node.end_date) return 'later';
    var d = H.diffDays(S.today, node.end_date);
    if (d < 0) return 'delayed';
    if (d === 0) return 'today';
    if (d <= 7) return 'week';
    return 'later';
  }

  function myUnits() {
    var out = [];
    if (S.items === null || !S.me) return out;
    S.projects.forEach(function (p) {
      var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
      H.flatten(tree).forEach(function (r) {
        if (r.calc.hasChildren) return;
        if (r.node.assignee_user_id !== S.me.user_id) return;
        out.push({ node: r.node, calc: r.calc, project: p, group: dueGroup(r.node, r.calc) });
      });
    });
    return out;
  }

  /** ⑬ 個人ページ：1人分の担当タスク・関わるプロジェクト・担当分のガントをまとめる */
  function viewMember() {
    var uid = S.memberUserId || (S.me ? S.me.user_id : null);
    var person = S.users.filter(function (u) { return u.user_id === uid; })[0];
    var isSelf = S.me && uid === S.me.user_id;

    if (!person) {
      return head('個人ページ', '', '') + '<div class="empty">この担当者は一覧に見当たりません（common 未登録・退職などの可能性があります）</div>';
    }
    if (S.items === null) {
      return head(person.name + ' さん', person.email, '') + '<div class="empty">タスクを読み込んでいます…</div>';
    }

    var units = [];
    S.projects.forEach(function (p) {
      var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
      H.flatten(tree).forEach(function (r) {
        if (r.calc.hasChildren) return;
        if (r.node.assignee_user_id !== uid) return;
        units.push({ node: r.node, calc: r.calc, project: p, group: dueGroup(r.node, r.calc) });
      });
    });
    var order = ['delayed', 'today', 'week', 'later', 'done'];
    var by = {};
    order.forEach(function (k) { by[k] = units.filter(function (u) { return u.group === k; }); });
    var tab = order.indexOf(S.memberTab) >= 0 ? S.memberTab : 'delayed';

    var taskRows = by[tab].map(function (m) {
      return '<tr>' +
        '<td><div class="cell">' + typeChip(m.node.item_type) +
          ' <a class="t" href="javascript:void(0)" data-edit="' + esc(m.node.item_id) + '" style="display:inline">' + esc(m.node.name) + '</a>' +
          '<span class="s">' + esc(m.node.item_key) + ' ・ ' + esc(m.project.key) + ' ' + esc(m.project.name) + '</span></div></td>' +
        '<td class="col-hide">' + periodText(m.node.start_date, m.node.end_date) + '</td>' +
        '<td>' + progBar(m.calc) + '</td>' +
        '<td>' + dueText(m.calc) + '</td>' +
        '<td>' + badge(m.calc.health) + '</td></tr>';
    }).join('');

    // 関わっているプロジェクト（未完了を1件でも持つもの）
    var pids = {};
    units.forEach(function (u) { if (u.node.status !== 'done') pids[u.project.project_id] = u.project; });
    var projRows = Object.keys(pids).map(function (pid) {
      var pr = pids[pid];
      var c = S.summary[pid] || {};
      var openHere = units.filter(function (u) { return u.project.project_id === pid && u.node.status !== 'done'; }).length;
      return '<tr><td><div class="cell"><a class="t" data-project="' + esc(pid) + '">' + esc(pr.name) + '</a>' +
          '<span class="s">' + esc(pr.key) + ' ・ 未完了 ' + openHere + ' 件</span></div></td>' +
        '<td>' + badge(c.health || 'no_period') + '</td></tr>';
    }).join('');

    // 担当分のガント（未完了のみ、開始日順）
    var ganttRows = units.filter(function (u) { return u.node.status !== 'done'; })
      .sort(function (a, b) { return String(a.node.start_date || '9999').localeCompare(String(b.node.start_date || '9999')); })
      .map(function (u) {
        return { name: u.node.name, itemType: u.node.item_type, itemKey: u.node.item_key, level: 1,
          startDate: u.node.start_date, endDate: u.node.end_date, calc: u.calc, href: u.node.item_id, tag: u.project.key };
      });

    return '<div class="breadcrumb"><a data-nav="people">担当者一覧</a> ／ ' + esc(person.name) + '</div>' +
      head(person.name + ' さん' + (isSelf ? '（自分）' : ''),
        esc(person.email || '') + (person.dept ? ' ・ ' + esc(person.dept) : '') + (person.position ? ' ・ ' + esc(person.position) : ''), '') +
      '<div class="toolbar">' +
        '<span class="label">未完了</span><span class="count">' + units.filter(function (u) { return u.node.status !== 'done'; }).length + ' 件</span>' +
        '<span class="label">遅延</span><span class="count">' + by.delayed.length + ' 件</span>' +
        '<span class="spacer"></span><span class="count">関わるPJ ' + Object.keys(pids).length + ' 件</span>' +
      '</div>' +
      '<div class="tabs">' + order.map(function (k) {
        return '<button data-mtab="' + k + '"' + (k === tab ? ' class="active"' : '') + '>' + DUE_LABEL[k] + ' ' + by[k].length + '</button>';
      }).join('') + '</div>' +
      '<section class="card" style="margin-bottom:20px"><div class="tbl-wrap">' +
        (by[tab].length
          ? '<table class="tbl"><colgroup><col><col class="col-hide" style="width:180px"><col style="width:150px">' +
            '<col style="width:120px"><col style="width:112px"></colgroup>' +
            '<thead><tr><th>タスク</th><th class="col-hide">期間</th><th>進捗</th><th>期限</th><th>状態</th></tr></thead>' +
            '<tbody>' + taskRows + '</tbody></table>'
          : '<div class="empty">この区分のタスクはありません</div>') +
      '</div></section>' +
      '<section class="card" style="margin-bottom:20px"><div class="card-head"><h2>関わっているプロジェクト</h2></div>' +
        '<div class="tbl-wrap">' + (projRows
          ? '<table class="tbl"><colgroup><col><col style="width:104px"></colgroup><tbody>' + projRows + '</tbody></table>'
          : '<div class="empty">未完了で関わっているプロジェクトはありません</div>') + '</div></section>' +
      '<section class="card"><div class="card-head"><h2>担当分のガント</h2></div><div class="tbl-wrap">' +
        ganttHtml(ganttRows, { today: S.today, labelHead: 'タスク（期間）', emptyText: '期間の入った未完了のタスクがありません' }) +
      '</div><div class="card-body" style="border-top:1px solid var(--border);padding:12px 20px">' + ganttLegend() + '</div></section>';
  }

  function viewMine() {
    if (S.items === null) return head('マイタスク', '', '') + '<div class="empty">タスクを読み込んでいます…</div>';
    var mine = myUnits();
    var order = ['delayed', 'today', 'week', 'later', 'done'];
    var by = {};
    order.forEach(function (k) { by[k] = mine.filter(function (m) { return m.group === k; }); });
    var tab = order.indexOf(S.mineTab) >= 0 ? S.mineTab : 'delayed';

    var rows = by[tab].map(function (m) {
      return '<tr>' +
        '<td><div class="cell">' + typeChip(m.node.item_type) +
          ' <a class="t" data-edit="' + esc(m.node.item_id) + '" style="display:inline">' + esc(m.node.name) + '</a>' +
          '<span class="s">' + esc(m.node.item_key) + ' ・ ' + esc(m.project.key) + ' ' + esc(m.project.name) + '</span></div></td>' +
        '<td class="col-hide">' + periodText(m.node.start_date, m.node.end_date) + '</td>' +
        '<td><select class="inline" data-status="' + esc(m.node.item_id) + '" aria-label="ステータス">' +
          optionList(H.STATUS_ORDER.map(function (k) { return [k, H.STATUS_LABEL[k]]; }), m.node.status) + '</select></td>' +
        '<td style="white-space:nowrap"><input class="inline" type="number" min="0" max="100" step="5" style="width:78px;text-align:right"' +
          ' data-rate="' + esc(m.node.item_id) + '" value="' + Math.round(m.calc.actualRate * 100) + '" aria-label="進捗率"> %</td>' +
        '<td>' + dueText(m.calc) + '</td>' +
        '<td>' + badge(m.calc.health) + '</td></tr>';
    }).join('');

    return head((S.me ? S.me.name + ' さんのタスク' : 'マイタスク'),
        'アサインされたタスクを、プロジェクトをまたいで期限順に並べています',
        S.me ? '<a class="btn" href="javascript:void(0)" data-person="' + esc(S.me.user_id) + '">自分の個人ページ</a>' : '') +
      '<div class="tabs">' + order.map(function (k) {
        return '<button data-minetab="' + k + '"' + (k === tab ? ' class="active"' : '') + '>' +
          DUE_LABEL[k] + ' ' + by[k].length + '</button>';
      }).join('') + '</div>' +
      '<div class="toolbar"><span class="spacer"></span><span class="count">タスク ' + by[tab].length + ' 件</span></div>' +
      '<section class="card"><div class="tbl-wrap">' +
        (by[tab].length
          ? '<table class="tbl"><colgroup><col><col class="col-hide" style="width:230px"><col style="width:132px">' +
            '<col style="width:126px"><col style="width:120px"><col style="width:112px"></colgroup>' +
            '<thead><tr><th>タスク</th><th class="col-hide">期間</th><th>ステータス</th><th>進捗率</th>' +
            '<th>期限</th><th>状態</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table>'
          : '<div class="empty">この区分のタスクはありません</div>') +
      '</div></section>';
  }

  // ---- ⑪ 担当者一覧 ----
  function viewPeople() {
    if (S.items === null) return head('担当者一覧', '', '') + '<div class="empty">タスクを読み込んでいます…</div>';
    var units = [];
    S.projects.forEach(function (p) {
      var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
      H.flatten(tree).forEach(function (r) {
        if (r.calc.hasChildren) return;
        units.push({ node: r.node, calc: r.calc, project: p });
      });
    });

    function stats(uid) {
      var mine = units.filter(function (u) {
        return uid === null ? !u.node.assignee_user_id : u.node.assignee_user_id === uid;
      });
      var open = mine.filter(function (u) { return u.node.status !== 'done'; });
      var pids = {};
      open.forEach(function (u) { pids[u.project.project_id] = true; });
      return {
        open: open.length, done: mine.length - open.length,
        delayed: open.filter(function (u) { return u.calc.health === 'delayed'; }).length,
        today: open.filter(function (u) { return dueGroup(u.node, u.calc) === 'today'; }).length,
        pj: Object.keys(pids).length
      };
    }

    var list = S.users.map(function (u) { return { uid: u.user_id, name: u.name, mail: u.email, s: stats(u.user_id) }; });
    var none = stats(null);
    if (none.open + none.done > 0) list.push({ name: '未アサイン', mail: '担当を決める必要があります', s: none, none: true });
    var ps = S.peopleSort || 'delayed';
    list.sort(function (a, b) {
      if (ps === 'name') return String(a.name).localeCompare(String(b.name), 'ja');
      if (ps === 'open') return b.s.open - a.s.open;
      return b.s.delayed - a.s.delayed || b.s.open - a.s.open;
    });

    var rows = list.map(function (r) {
      var nameHtml = r.none
        ? '<span class="t" style="color:var(--text-faint)">' + esc(r.name) + '</span>'
        : '<a class="t" href="javascript:void(0)" data-person="' + esc(r.uid) + '" style="display:inline">' + esc(r.name) + '</a>';
      return '<tr>' +
        '<td><div class="cell">' + nameHtml +
          '<span class="s">' + esc(r.mail) + '</span></div></td>' +
        '<td class="r num">' + r.s.open + '</td>' +
        '<td class="r num">' + (r.s.delayed ? '<span class="late">' + r.s.delayed + '</span>' : '<span class="faint">0</span>') + '</td>' +
        '<td class="r num col-hide">' + r.s.today + '</td>' +
        '<td class="r num col-hide faint">' + r.s.done + '</td>' +
        '<td class="r num">' + r.s.pj + '</td></tr>';
    }).join('');

    var tabs = '<div class="tabs">' +
        '<button data-petab="list"' + (S.peopleTab !== 'gantt' ? ' class="active"' : '') + '>一覧</button>' +
        '<button data-petab="gantt"' + (S.peopleTab === 'gantt' ? ' class="active"' : '') + '>ガント</button>' +
      '</div>';
    var pageHead = head('担当者一覧', '誰にどれだけ溜まっているかを件数で見ます', '');

    if (S.peopleTab === 'gantt') return pageHead + tabs + peopleGanttBody(units);

    return pageHead + tabs +
      '<div class="toolbar"><span class="label">並び順</span>' +
        '<select class="inline" id="pp-sort">' +
          optionList([['delayed', '遅延が多い順'], ['open', '未完了が多い順'], ['name', '名前順']], S.peopleSort || 'delayed') +
        '</select>' +
        '<span class="spacer"></span><span class="count">担当者 ' + S.users.length + ' 人</span></div>' +
      '<section class="card"><div class="tbl-wrap">' +
        '<table class="tbl"><colgroup><col><col style="width:110px"><col style="width:100px">' +
        '<col class="col-hide" style="width:118px"><col class="col-hide" style="width:100px"><col style="width:118px"></colgroup>' +
        '<thead><tr><th>担当者</th><th class="r">未完了</th><th class="r">遅延</th>' +
        '<th class="r col-hide">今日期限</th><th class="r col-hide">完了</th><th class="r">関わるPJ</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
      '</div></section>';
  }

  /** ⑫ 担当者別ガント：担当者 ＞ プロジェクト ＞ タスクの順に1本の時間軸へ並べる */
  function peopleGanttBody(units) {
    S.peopleGanttOpen = S.peopleGanttOpen || {};
    var byProject = S.peopleGanttGroupByProject !== false;
    var showDone = !!S.peopleGanttShowDone;
    var filterUser = S.peopleGanttUser;

    var people = S.users.slice();
    var rows = [];
    var shownCount = 0, taskCount = 0;

    function personUnits(uid) {
      return units.filter(function (u) {
        if (!showDone && u.node.status === 'done') return false;
        return uid === '@none' ? !u.node.assignee_user_id : u.node.assignee_user_id === uid;
      });
    }
    function range(list) {
      var s = null, e = null;
      list.forEach(function (u) {
        if (!u.node.start_date || !u.node.end_date) return;
        if (!s || u.node.start_date < s) s = u.node.start_date;
        if (!e || u.node.end_date > e) e = u.node.end_date;
      });
      return { s: s, e: e };
    }

    var targets = filterUser ? [{ user_id: filterUser, name: userName(filterUser) }] : people.concat([{ user_id: '@none', name: '未アサイン' }]);
    targets.forEach(function (u) {
      var list = personUnits(u.user_id);
      if (!list.length) return;
      shownCount++; taskCount += list.length;
      var r = range(list);
      var open = !!S.peopleGanttOpen[u.user_id];
      var delayedCnt = list.filter(function (x) { return x.calc.health === 'delayed'; }).length;
      rows.push({
        kind: 'group', name: u.name, open: open, startDate: r.s, endDate: r.e,
        calc: { health: delayedCnt ? 'delayed' : 'on_track' },
        attrs: ' data-petoggle="' + esc(u.user_id) + '"',
        badgeHtml: delayedCnt ? ' <span class="late">遅延 ' + delayedCnt + '</span>' : '',
        metaHtml: list.length + ' 件' + (r.s ? ' ・ ' + periodText(r.s, r.e) : '')
      });
      if (!open) return;

      if (byProject) {
        var byPid = {};
        list.forEach(function (x) { (byPid[x.project.project_id] = byPid[x.project.project_id] || []).push(x); });
        Object.keys(byPid).forEach(function (pid) {
          var g = byPid[pid], pr = range(g);
          rows.push({ kind: 'sub', name: g[0].project.key + ' ' + g[0].project.name, startDate: pr.s, endDate: pr.e,
            calc: { health: 'on_track' }, metaHtml: g.length + ' 件' });
          g.sort(function (a, b) { return String(a.node.start_date || '9999').localeCompare(String(b.node.start_date || '9999')); })
            .forEach(function (x) {
              rows.push({ name: x.node.name, itemType: x.node.item_type, itemKey: x.node.item_key, level: 2,
                startDate: x.node.start_date, endDate: x.node.end_date, calc: x.calc, href: x.node.item_id });
            });
        });
      } else {
        list.slice().sort(function (a, b) { return String(a.node.start_date || '9999').localeCompare(String(b.node.start_date || '9999')); })
          .forEach(function (x) {
            rows.push({ name: x.node.name, itemType: x.node.item_type, itemKey: x.node.item_key, level: 1,
              startDate: x.node.start_date, endDate: x.node.end_date, calc: x.calc, href: x.node.item_id,
              tag: x.project.key + ' ' + x.project.name });
          });
      }
    });

    return '<div class="toolbar">' +
        '<span class="label">担当者</span>' +
        '<select class="inline" id="pgt-user">' + optionList([['', '全員']].concat(S.users.map(function (u) { return [u.user_id, u.name]; })), S.peopleGanttUser) + '</select>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="pgt-group"' + (byProject ? ' checked' : '') + '> プロジェクトでまとめる</label>' +
        '<label class="label" style="cursor:pointer"><input type="checkbox" id="pgt-done"' + (showDone ? ' checked' : '') + '> 完了も表示</label>' +
        '<span class="spacer"></span><span class="count">' + shownCount + ' 人 ・ ' + taskCount + ' 件</span>' +
      '</div>' +
      '<section class="card"><div class="tbl-wrap">' +
        ganttHtml(rows, { today: S.today, labelHead: '担当者 ／ プロジェクト ／ タスク（期間）', emptyText: '担当されているタスクがありません' }) +
      '</div>' +
        '<div class="card-body" style="border-top:1px solid var(--border);padding:12px 20px">' + ganttLegend() + '</div></section>';
  }

  // ---- ⑩ 横断検索 ----
  var searchState = { text: '', pj: '', who: '', status: '' };
  function viewSearch() {
    if (S.items === null) return head('横断検索', '', '') + '<div class="empty">タスクを読み込んでいます…</div>';
    var all = [];
    S.projects.forEach(function (p) {
      var tree = H.evaluateTree(p, itemsOf(p.project_id), S.today);
      H.flatten(tree).forEach(function (r) { all.push({ node: r.node, calc: r.calc, project: p }); });
    });

    var q = searchState.text.trim().toLowerCase();
    var rows = all.filter(function (r) {
      var n = r.node;
      if (q && (n.name + ' ' + n.item_key).toLowerCase().indexOf(q) < 0) return false;
      if (searchState.pj && n.project_id !== searchState.pj) return false;
      if (searchState.who === '@none' ? !!n.assignee_user_id : (searchState.who && n.assignee_user_id !== searchState.who)) return false;
      if (searchState.status && n.status !== searchState.status) return false;
      return true;
    });

    var body = rows.map(function (r) {

        '<td><div class="cell">' + typeChip(r.node.item_type) +

        '<td>' + badge(r.calc.health) + '</td>' +
        '<td class="col-hide">' + dueText(r.calc) + '</td>' +
        '<td>' + assignee(r.node.assignee_user_id) + '</td></tr>';
    }).join('');

    return head('横断検索', '全プロジェクトのタスクをまとめて探します', '') +
      '<div class="toolbar">' +
        '<input class="inline" id="s-text" type="search" placeholder="タスク名・キーで探す" value="' + esc(searchState.text) + '" style="flex:1 1 240px">' +
        '<span class="label">プロジェクト</span>' +
        '<select class="inline" id="s-pj">' + optionList([['', 'すべて']].concat(
          S.projects.map(function (p) { return [p.project_id, p.name]; })), searchState.pj) + '</select>' +
        '<span class="label">担当者</span>' +
        '<select class="inline" id="s-who">' + optionList([['', 'すべて'], ['@none', '未アサイン']].concat(
          S.users.map(function (u) { return [u.user_id, u.name]; })), searchState.who) + '</select>' +
        '<span class="label">ステータス</span>' +
        '<select class="inline" id="s-status">' + optionList([['', 'すべて']].concat(
          H.STATUS_ORDER.map(function (k) { return [k, H.STATUS_LABEL[k]]; })), searchState.status) + '</select>' +
        '<span class="spacer"></span><span class="count">見つかったタスク ' + rows.length + ' 件</span>' +
      '</div>' +
      '<section class="card"><div class="tbl-wrap">' +
        (rows.length
          ? '<table class="tbl"><colgroup><col><col class="col-hide" style="width:230px"><col style="width:120px">' +
            '<col class="col-hide" style="width:128px"><col style="width:140px"></colgroup>' +
            '<thead><tr><th>タスク</th><th class="col-hide">プロジェクト</th><th>状態</th>' +
            '<th class="col-hide">期限</th><th>担当</th></tr></thead><tbody>' + body + '</tbody></table>'
          : '<div class="empty">条件に合うタスクがありません</div>') +
      '</div></section>';
  }

  function optionList(pairs, cur) {
    return pairs.map(function (p) {
      return '<option value="' + esc(p[0]) + '"' + (String(p[0]) === String(cur) ? ' selected' : '') + '>' + esc(p[1]) + '</option>';

  function wireInputs() {

      };
      google.script.run.withSuccessHandler(function (s) { S.settings = s; stSave.disabled = false; toast('保存しました'); })
        .withFailureHandler(function (err) { stSave.disabled = false; fail(err); }).saveSettings(patch);
