<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ================================================================
 * PJ管理（簡易版）の見た目
 *   PC（1001px〜）   … 左にナビ、上に帯
 *   タブレット（〜1000px）… 左はアイコンの細い帯
 *   スマホ（〜600px） … 下に5つのタブ、右下に作成ボタン、編集は下から出す
 * 一覧の行・ガントは「自分の幅」で並びを変える（コンテナクエリ）。
 * ================================================================ */
:root {
  --paper: #F3F4F0; --surface: #FFFFFF; --sunken: #EBEDE8; --line: #CBD0C6; --line2: #DEE2DA;
  --ink: #1B2126; --ink2: #4C555D; --ink3: #7C858C;
  --accent: #3446A6; --accent-hover: #2A3A8F; --accent-ink: #FFFFFF; --accent-soft: #E6E9F7;
  --late: #BD3F2C; --late-bg: #FBE6E1;
  --on: #2B7650; --on-bg: #DFF0E6;
  --pre: #857A62; --pre-bg: #EFEBE1;
  --done: #56616C; --done-bg: #E6E9EC;
  --save: #9A6412; --save-bg: #FBEFD6; --save-line: #E8B962;
  --today: #D2452F;
  --warn: #B4560F; --warn-bg: #FCEBDD;
  --shadow: 0 1px 2px rgba(20, 28, 36, .06), 0 8px 24px rgba(20, 28, 36, .12);
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --f-disp: "Zen Kaku Gothic New", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top-h: 56px; --nav-w: 216px; --tab-h: 64px;
  /* 以前の名前（画面の組み立てのあちこちで使っている） */
  --text: var(--ink); --text-muted: var(--ink2); --text-faint: var(--ink3);
  --surface-2: var(--sunken); --surface-3: var(--line2); --border: var(--line); --bar-track: var(--sunken);
  --h-on-track: var(--on); --h-on-track-bg: var(--on-bg); --h-delayed: var(--late); --h-delayed-bg: var(--late-bg);
  --h-done: var(--done); --h-done-bg: var(--done-bg); --h-not-started: var(--pre); --h-not-started-bg: var(--pre-bg);
  --today-line: var(--today);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #0E1215; --surface: #1C2228; --sunken: #262E35; --line: #4A545E; --line2: #363F47;
    --ink: #E4E7E3; --ink2: #AEB5BA; --ink3: #929BA2;
    --accent: #97A5F4; --accent-hover: #B3BDF7; --accent-ink: #10152E; --accent-soft: #252C4C;
    --late: #F0856F; --late-bg: #3A2320; --on: #6FCB98; --on-bg: #1C3327; --pre: #C9BC9B; --pre-bg: #2E2A21;
    --done: #A7B1BB; --done-bg: #262C32; --save: #F2C46E; --save-bg: #3A2F18; --save-line: #8A6A2C; --today: #F07A62; --warn: #F2A266; --warn-bg: #3A2718;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .45);
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overscroll-behavior-x: none; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
a { color: var(--accent); text-decoration: none; cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.35; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.faint, .muted { color: var(--ink3); }
.late { color: var(--late); font-weight: 700; }
.spacer { flex: 1; }
.help { font-size: 12.5px; color: var(--ink3); margin: 0; }

/* ================================================================ 外枠 */
.app { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); grid-template-rows: var(--top-h) auto; min-height: 100vh; }
.topbar {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 30; height: var(--top-h);
  display: flex; align-items: center; gap: 12px; padding: 0 16px 0 18px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-disp); font-weight: 700; font-size: 16px; width: calc(var(--nav-w) - 30px); white-space: nowrap; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-style: normal; font-family: var(--f-mono); font-size: 11px; font-weight: 500; flex-shrink: 0; }
.gsearch {
  flex: 1 1 auto; max-width: 440px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  border: 1px solid var(--line2); border-radius: 9px; background: var(--sunken); color: var(--ink3); font-size: 13px; text-align: left;
}
.gsearch:hover { border-color: var(--line); }
.gsearch kbd { margin-left: auto; font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; background: var(--surface); }
.savest { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; color: var(--ink2); background: var(--sunken); border: 1px solid transparent; }
.savest.busy { color: var(--save); background: var(--save-bg); border-color: var(--save-line); font-weight: 700; }
.savest .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn { position: relative; width: 38px; height: 38px; flex-shrink: 0; display: inline-grid; place-items: center; border: none; border-radius: 9px; background: transparent; color: var(--ink2); }
.icon-btn:hover { background: var(--sunken); }
.bell-dot { position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--late); border: 2px solid var(--surface); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }

.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11.5px; font-weight: 700; color: #fff; flex-shrink: 0; line-height: 1; }
.av.lg { width: 48px; height: 48px; font-size: 18px; }
.av.md { width: 34px; height: 34px; font-size: 13px; }
.av.none { background: var(--line); color: var(--ink2); }

.sidebar {
  position: sticky; top: var(--top-h); height: calc(100vh - var(--top-h)); overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px;
}
.sidebar .group { font-size: 11px; letter-spacing: .1em; color: var(--ink3); padding: 14px 10px 4px; }
.sidebar .group:first-child { padding-top: 2px; }
.sidebar a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink2); font-size: 13.5px; position: relative; }
.sidebar a:hover { background: var(--sunken); color: var(--ink); }
.sidebar a.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.sidebar .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 11px; color: var(--late); font-weight: 500; }
.main { min-width: 0; padding: 22px 28px 48px; display: flex; flex-direction: column; gap: 16px; }
.tabbar, .fab { display: none; }
.loading { padding: 60px 0; text-align: center; color: var(--ink3); }

/* ================================================================ 見出し */
.breadcrumb { font-size: 12.5px; color: var(--ink3); }
.breadcrumb a { color: var(--ink3); }
.breadcrumb a:hover { color: var(--accent); }
.page-head { display: flex; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
.page-head > .ph-t { min-width: 0; flex: 1 1 auto; }
.page-head h1 { font-family: var(--f-disp); font-size: 24px; line-height: 1.3; text-wrap: balance; }
.page-head .sub { font-size: 13px; color: var(--ink3); margin-top: 3px; }
.page-head .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ================================================================ 部品 */
.btn {
  height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 13.5px; white-space: nowrap; color: var(--ink);
}
.btn:hover { background: var(--sunken); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--late); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn.icon { width: 36px; padding: 0; }
.btn.sm.icon { width: 30px; }

.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line2); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .1); }
.seg .c { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); font-weight: 400; }
.seg .c.l { color: var(--late); font-weight: 500; }
.seg.full { display: grid; grid-auto-columns: minmax(0, 1fr); grid-auto-flow: column; width: 100%; }

.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.bar .count, .count { font-size: 12.5px; color: var(--ink3); font-family: var(--f-mono); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.chip:hover { border-color: var(--ink3); }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.chip .x { opacity: .7; margin-left: 2px; }
.chip b { font-family: var(--f-mono); font-weight: 500; }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px; background-size: 5px 5px; background-repeat: no-repeat; width: auto; max-width: 100%; }
select.chip.on { background-color: var(--accent-soft); }
label.chip { cursor: pointer; }
label.chip input { margin: 0; accent-color: var(--accent); }

.badge { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 7px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.badge i { font-style: normal; width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; line-height: 1; flex-shrink: 0; }
.badge.delayed { color: var(--late); background: var(--late-bg); }
.badge.delayed i { background: var(--late); color: var(--late-bg); }
.badge.on_track { color: var(--on); background: var(--on-bg); }
.badge.on_track i { background: var(--on); }
.badge.on_track i::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--on-bg); }
.badge.not_started { color: var(--pre); background: var(--pre-bg); }
.badge.not_started i { border: 2px solid var(--pre); }
.badge.done { color: var(--done); background: var(--done-bg); }
.badge.done i { color: var(--done); font-size: 12px; }
.badge.no_period { color: var(--ink3); background: transparent; border: 1px dashed var(--line); }
.badge.sm { height: 20px; font-size: 11px; padding: 0 7px 0 5px; }
.type { font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--sunken); color: var(--ink2); white-space: nowrap; flex-shrink: 0; line-height: 1.6; }
.type.bug { background: var(--late-bg); color: var(--late); }
.type.req { background: var(--accent-soft); color: var(--accent); }
.tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--line2); color: var(--ink2); white-space: nowrap; }
.tag.req { background: var(--late-bg); color: var(--late); font-weight: 700; }
.who { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who.none { color: var(--ink3); }

.prog-wrap { display: flex; align-items: center; gap: 9px; min-width: 0; width: 100%; }
.prog { position: relative; flex: 1; height: 7px; border-radius: 99px; background: var(--sunken); min-width: 50px; }
.prog .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--pre); }
.prog.on_track .fill { background: var(--on); }
.prog.delayed .fill { background: var(--late); }
.prog.done .fill { background: var(--done); }
.prog .planned { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--ink); opacity: .5; }
.prog-wrap .pct { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); width: 36px; text-align: right; flex-shrink: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card.clip { overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--sunken); border-radius: 11px 11px 0 0; flex-wrap: wrap; }
.card-head h2 { font-size: 14.5px; }
.card-body { padding: 14px 16px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink3); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.skel { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px; }
.skel i { display: block; height: 12px; border-radius: 6px; background: var(--sunken); animation: pulse 1.4s ease-in-out infinite; }
.skel i:nth-child(3n+2) { width: 72%; } .skel i:nth-child(3n) { width: 48%; }
@keyframes pulse { 50% { opacity: .5; } }

/* ---- 入力 ---- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
.field > label { font-size: 12px; color: var(--ink3); font-weight: 700; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface); font-size: 14px; font-family: inherit; color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input:disabled, select:disabled, textarea:disabled { background: var(--sunken); color: var(--ink3); }
textarea { resize: vertical; min-height: 72px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.fsec { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
.fsec + .fsec { border-top: 1px solid var(--line2); padding-top: 16px; margin-top: 4px; }
.fsec > h3 { font-size: 13.5px; margin-bottom: 8px; }
.switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; appearance: none; -webkit-appearance: none; border-radius: 999px; background: var(--line); cursor: pointer; transition: background .15s; margin: 0; min-height: 0; padding: 0; border: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 19px; }
.switch:disabled { opacity: .5; cursor: default; }
.stp { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; min-height: 40px; background: var(--surface); }
.stp > button { border: 0; background: var(--sunken); color: var(--ink2); font-size: 17px; }
.stp > button:hover { background: var(--line2); color: var(--ink); }
.stp > input { border: 0; border-radius: 0; text-align: center; min-height: 0; font-family: var(--f-mono); padding: 0 4px; }
.stp > input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent-soft); }
.stbtn { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stbtn button { min-height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 13px; color: var(--ink2); }
.stbtn button.active { border: 2px solid var(--accent); color: var(--accent); font-weight: 700; background: var(--accent-soft); }
.rate { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
.rate button { height: 30px; border: 0; border-radius: 6px; background: var(--sunken); font-family: var(--f-mono); font-size: 10.5px; color: var(--ink3); padding: 0; }
.rate button.f { background: color-mix(in srgb, var(--on) 28%, var(--surface)); color: var(--on); }
.rate button.active { background: var(--on); color: #fff; font-weight: 500; }
.rate button:disabled { cursor: default; opacity: .6; }
.shift { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.shift button { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); font-size: 12.5px; font-family: var(--f-mono); color: var(--ink2); }
.shift button:hover { background: var(--sunken); }

/* ================================================================ 一覧の行（全一覧で同じ形） */
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; container-type: inline-size; container-name: rows; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 104px 168px 96px 132px 148px; gap: 0 16px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line2); min-width: 0; }
.row:first-child { border-top: 0; }
.row.head { font-size: 11.5px; color: var(--ink3); background: var(--sunken); padding-block: 7px; font-weight: 700; letter-spacing: .03em; border-bottom: 1px solid var(--line); }
.row.head + .row { border-top: 0; }
.row.grp { display: flex; gap: 8px; align-items: center; padding-block: 7px; background: var(--sunken); font-size: 12.5px; font-weight: 700; color: var(--ink2); }
.row.grp .c { font-family: var(--f-mono); font-weight: 400; color: var(--ink3); }
.row.grp .k { font-weight: 400; color: var(--ink3); }
.count small { font-size: 11.5px; margin-left: 2px; }
.row.click { cursor: pointer; }
.row.click:hover { background: color-mix(in srgb, var(--sunken) 55%, var(--surface)); }
.r-name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r-name .t { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 7px; min-width: 0; }
.r-name .t .nm { font-weight: 700; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }   /* 名前は切らずに折り返す（横の印に押されて消えないように） */
.r-name .t a.nm:hover { color: var(--accent); text-decoration: underline; }
.r-name.lv2 { padding-left: 24px; }
.r-name.lv2 .t .nm { font-weight: 400; }
/* 日付が yyyy/mm/dd で長くなったので、切らずに折り返す（日付そのものは途中で割らない） */
.r-sub, .r-sub2 { font-size: 12px; color: var(--ink3); line-height: 1.5; overflow-wrap: normal; }
.r-sub .mono, .r-sub2 .upd-at { white-space: nowrap; }
.r-sub .k { font-family: var(--f-mono); }
.r-sub2 { display: none; }
.r-due { font-size: 12.5px; white-space: nowrap; }
.due-d { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); white-space: nowrap; }
.due-d.blk { display: block; }
.due-in { white-space: nowrap; }
.r-upd { font-size: 12px; color: var(--ink3); line-height: 1.4; min-width: 0; }
.r-upd b { display: block; color: var(--ink2); font-weight: 400; font-family: var(--f-mono); font-size: 11.5px; }
.r-num { font-family: var(--f-mono); font-size: 15px; text-align: right; }
.r-num em { display: none; font-style: normal; font-family: var(--f-body); font-size: 11px; color: var(--ink3); margin-right: 4px; }
.lpill { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 999px; background: var(--late-bg); color: var(--late); font-size: 11.5px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
/* 親子：親の名前の下にボタン、子は薄い地と左の線で親につなぐ */
.r-acts { grid-column: 1 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.kbtn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 12px; color: var(--ink2); white-space: nowrap; }
.kbtn:hover { background: var(--sunken); color: var(--ink); }
.kbtn.add { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); border-style: dashed; }
.kbtn.add:hover { background: var(--accent-soft); }
.kbtn .late { font-weight: 500; }
@media (pointer: coarse) { .kbtn { height: 38px; font-size: 13px; padding: 0 14px 0 10px; } }
.row.kid { position: relative; background: color-mix(in srgb, var(--accent-soft) 35%, var(--surface)); }
.row.kid + .row.kid { border-top-color: color-mix(in srgb, var(--accent) 10%, var(--line2)); }
.row.kid::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 3px; background: color-mix(in srgb, var(--accent) 45%, transparent); z-index: 1; }
.row.par + .row.kid::before { top: 10px; border-radius: 3px 3px 0 0; }
.row.kid.last::before { bottom: 10px; border-radius: 0 0 3px 3px; }
.row.par + .row.kid.last::before { border-radius: 3px; }
.row.kid .r-name.lv2 { padding-left: 22px; }
@container rows (max-width: 880px) {
  .row { grid-template-columns: minmax(0, 1fr) 100px 150px 92px; }
  .row > .r-who, .row > .r-upd { display: none; }
  .r-sub2 { display: block; }
}
@container rows (max-width: 560px) {
  .row.head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name st" "prog due"; gap: 9px 12px; padding: 13px 14px; }
  .row > .r-name { grid-area: name; }
  .row > .r-st { grid-area: st; align-self: start; }
  .row > .r-prog { grid-area: prog; }
  .row > .r-due { grid-area: due; justify-self: end; }
  .r-name .t { flex-wrap: wrap; row-gap: 3px; }
  .r-name .t .nm { white-space: normal; overflow: visible; }
  .r-name.lv2 { padding-left: 14px; }
  .row.kid::before { left: 18px; }
  .row.kid .r-name.lv2 { padding-left: 18px; }
  .row > .r-acts { grid-area: acts; margin-top: 0; }
  .row.proj .r-sub { display: none; }
  .row:has(> .r-acts) { grid-template-areas: "name st" "prog due" "acts acts"; }
}
.fam-box { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunken); font-size: 13.5px; }
.fam-box .lbl { font-size: 12px; color: var(--ink3); flex-shrink: 0; }
.fam-box a { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.fam-list { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.fam-list a { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-left: 3px solid var(--ink3); border-radius: 8px; color: var(--ink); min-height: 44px; }
.fam-list a .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fam-list a:hover { background: var(--sunken); }

/* ---- 人の行（担当者一覧） ---- */
.prow { display: grid; grid-template-columns: minmax(0, 1fr) 88px 88px 88px 88px 88px; gap: 0 12px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line2); }
.prow:first-child { border-top: 0; }
.prow.head { font-size: 11.5px; color: var(--ink3); background: var(--sunken); padding-block: 7px; font-weight: 700; }
.prow.head > span:not(:first-child) { text-align: right; }
.prow .pn { display: flex; align-items: center; gap: 10px; min-width: 0; }
.prow .pn b, .prow .pn a { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.prow .pn a:hover { color: var(--accent); }
.prow .pn small { display: block; font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .r-num.l { color: var(--late); font-weight: 500; }
.prow .r-num.z { color: var(--ink3); }
@container rows (max-width: 640px) {
  .prow.head { display: none; }
  .prow { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 8px; padding: 13px 14px; }
  .prow .pn { grid-column: 1 / -1; }
  .prow .r-num { text-align: left; font-size: 16px; }
  .prow .r-num em { display: block; }
}

/* ---- マイタスクの行 ---- */
.mt { display: grid; grid-template-columns: minmax(0, 1fr) 150px 150px 92px; gap: 0 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line2); }
.mt:first-child { border-top: 0; }
select.qs { width: 100%; min-height: 36px; padding: 0 30px 0 10px; font-size: 13px; }
.qr { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; height: 36px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.qr button { border: 0; background: var(--sunken); color: var(--ink2); font-family: var(--f-mono); font-size: 11px; padding: 0; }
.qr button:hover { background: var(--line2); color: var(--ink); }
.qr b { display: grid; place-items: center; font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
@container rows (max-width: 600px) {
  .mt { grid-template-columns: 1fr 1fr; grid-template-areas: "name name" "st rate" "due due"; gap: 10px; padding: 13px 14px; }
  .mt > .r-name { grid-area: name; }
  .mt > .qs { grid-area: st; min-height: 44px; }
  .mt > .qr { grid-area: rate; height: 44px; grid-template-columns: 44px minmax(0, 1fr) 44px; }
  .mt > .r-due { grid-area: due; }
  .mt .r-name .t .nm { white-space: normal; }
}

/* ================================================================ 集計の帯・プロジェクトの頭 */
.sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sum button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sum button:hover { border-color: var(--ink3); }
.sum b { font-family: var(--f-mono); font-weight: 500; font-size: 22px; line-height: 1.2; }
.sum span { font-size: 12px; color: var(--ink3); }
.sum button.late { border-color: color-mix(in srgb, var(--late) 45%, var(--line)); background: color-mix(in srgb, var(--late-bg) 55%, var(--surface)); }
.sum button.late b, .sum button.late span { color: var(--late); }
.sum button.active { outline: 2px solid var(--accent); outline-offset: -1px; }
.sum b small { font-family: var(--f-body); font-size: 12px; color: var(--ink3); font-weight: 400; }
.sum button.late b small { color: var(--late); }
.sum-cap { font-size: 12.5px; font-weight: 700; color: var(--ink2); margin-bottom: -4px; }
.sum-cap span { font-weight: 400; color: var(--ink3); font-size: 12px; }
.lbanner { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--late) 40%, var(--line)); border-radius: 11px; background: color-mix(in srgb, var(--late-bg) 55%, var(--surface)); color: var(--late); font-size: 13.5px; text-align: left; flex-wrap: wrap; }
.lbanner > i { font-style: normal; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--late); color: var(--surface); font-size: 12px; font-weight: 700; flex-shrink: 0; }
.lbanner .go { margin-left: auto; font-size: 12.5px; font-weight: 700; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.lbanner.active { outline: 2px solid var(--accent); outline-offset: -1px; }
.row.proj .r-name .t { flex-wrap: wrap; row-gap: 3px; }
.row.proj .r-name .t .nm { white-space: normal; overflow: visible; }
.lbanner.ok { border-color: var(--line); background: var(--surface); color: var(--ink3); }
.fpanel { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.fpanel .field { margin: 0; }

.ph { display: flex; flex-direction: column; gap: 12px; }
.ph .ttl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ph .ttl h1 { font-family: var(--f-disp); font-size: 24px; line-height: 1.3; text-wrap: balance; }
.ph .meta { font-size: 12.5px; color: var(--ink3); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.ph .meta .mono { color: var(--ink2); }
.mx { display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.mx > div { padding: 10px 16px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.mx > div:first-child { border-left: 0; }
.mx .k { font-size: 11.5px; color: var(--ink3); letter-spacing: .03em; }
.mx .v { font-family: var(--f-mono); font-size: 18px; line-height: 1.25; }
.mx .v small { font-size: 12px; color: var(--ink3); margin-left: 4px; font-family: var(--f-body); white-space: nowrap; display: inline-block; }
.mx .note { font-size: 11.5px; color: var(--ink3); }
.views { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---- 概要 ---- */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.ov-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ov-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.alist a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 10px 16px; border-top: 1px solid var(--line2); color: var(--ink); }
.alist a:first-child { border-top: 0; }
.alist a:hover { background: var(--sunken); }
.alist a b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alist a .s { grid-column: 1 / -1; font-size: 12px; color: var(--ink3); }
.feed { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; font-size: 13px; }
.feed > div { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 1px 9px; }
.feed .t { grid-column: 2; font-size: 11.5px; color: var(--ink3); font-family: var(--f-mono); }
.fe-dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13px; }
.fe-dl dt { color: var(--ink3); }
.fe-dl dd { margin: 0; overflow-wrap: anywhere; }

/* ================================================================ ボード */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.board-col { background: var(--sunken); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; min-height: 120px; }
.board-col.over { border: 2px dashed var(--accent); background: var(--accent-soft); }
.board-col-head { display: flex; align-items: center; gap: 8px; margin: 2px 6px; font-size: 13px; font-weight: 700; }
.board-col-head .n { font-family: var(--f-mono); font-size: 11px; color: var(--ink3); font-weight: 400; }
.board-col-body { display: flex; flex-direction: column; gap: 8px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; cursor: grab; }
.tcard:hover { border-color: var(--ink3); }
.tcard .top { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink3); min-width: 0; }
.tcard .t { font-weight: 700; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
.tcard .par { font-size: 11.5px; color: var(--ink3); margin-top: -4px; }
.tcard .foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink2); min-width: 0; }
.tcard .acts { display: flex; gap: 8px; }
.tcard .acts .btn { flex: 1; }

/* ================================================================ ガント */
.gantt-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.gantt-scroll { overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; }
.gantt { position: relative; min-width: 860px; --glabel: 300px; }
.gantt .g-row, .gantt .g-head { display: grid; grid-template-columns: var(--glabel) minmax(520px, 1fr); }
/* 拡大・縮小（日・週・月・四半期）：1日あたりの幅を固定し、はみ出した分は横に流す。短い期間は画面の幅まで広げる */
.gantt.zoom { min-width: 0; width: max(100%, calc(var(--glabel) + var(--gtrack) + 24px)); }
.gantt.zoom .g-row, .gantt.zoom .g-head { grid-template-columns: var(--glabel) minmax(calc(var(--gtrack) + 24px), 1fr); }
.gantt .g-badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: 3px 0 1px; }   /* 状態・遅延の印は名前の下に（名前を押し出さない） */
.gtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.gantt .g-row { border-top: 1px solid var(--line2); min-height: 48px; }
.gantt .g-label {
  position: sticky; left: 0; z-index: 3; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px;
  padding: 7px 14px; background: var(--surface); border-right: 1px solid var(--line);
}
.gantt .g-name { display: flex; align-items: flex-start; gap: 7px; min-width: 0; font-size: 13px; font-weight: 700; }
.gantt .g-name .link, .gantt .g-name .txt { color: var(--ink); min-width: 0; overflow-wrap: anywhere; line-height: 1.45; }   /* 名前は切らずに折り返す */
.gantt .g-name .link:hover { color: var(--accent); text-decoration: underline; }
.gantt .g-dates { font-size: 11.5px; line-height: 1.45; color: var(--ink3); font-family: var(--f-mono); }  /* yyyy/mm/dd で長くなったので折り返す */
.gantt .g-dates .late { font-family: var(--f-body); }
.gantt .g-dates .nw { white-space: nowrap; font-family: var(--f-body); }
.gantt .g-row.lv2 .g-label { padding-left: 32px; }
.gantt .g-row.lv2 .g-name { font-weight: 400; }
.gantt .g-track { position: relative; margin: 0 12px; }
.gantt .g-head { background: var(--sunken); min-height: 46px; }
.gantt .g-headlabel { position: sticky; left: 0; z-index: 6; display: flex; align-items: flex-end; padding: 0 14px 7px; background: var(--sunken); border-right: 1px solid var(--line); font-size: 12px; color: var(--ink3); font-weight: 700; }
.gantt .g-axis { position: relative; margin: 0 12px; }
.gantt .g-months { position: relative; height: 22px; }
.gantt .g-month { position: absolute; top: 4px; padding-left: 5px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; border-left: 1px solid var(--line); line-height: 16px; }
.gantt .g-ticks { position: relative; height: 22px; font-family: var(--f-mono); font-size: 11px; color: var(--ink3); }
.gantt .g-tick { position: absolute; top: 3px; padding-left: 4px; white-space: nowrap; overflow: hidden; box-sizing: border-box; }
.gantt .g-tick.c, .gm-t.c { text-align: center; padding-left: 0; }
.gantt .g-tick small, .gm-t small { margin-left: 1px; font-family: var(--f-body); font-size: 9.5px; }
.gantt .g-tick.we, .gm-t.we { color: color-mix(in srgb, var(--ink3) 70%, transparent); }
.g-line.gl-day { background: color-mix(in srgb, var(--line2) 55%, transparent); }
.g-line.gl-major { background: var(--line); }
.g-we { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--sunken) 70%, transparent); pointer-events: none; }
.gantt .g-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line2); pointer-events: none; }
.gantt .g-line.month { background: var(--line); }
.gantt .g-today, .g-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--today); z-index: 2; pointer-events: none; }
.gantt .g-todaytag, .g-todaytag { position: absolute; top: 3px; transform: translateX(-50%); z-index: 5; line-height: 16px; height: 16px; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--today); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.g-bar { position: absolute; top: 50%; height: 20px; transform: translateY(-50%); border-radius: 6px; min-width: 4px; z-index: 1; display: flex; align-items: center; justify-content: flex-end; overflow: hidden; background: color-mix(in srgb, var(--pre) 30%, var(--surface)); }
.g-bar .g-done { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pre); }
.g-bar.on_track { background: color-mix(in srgb, var(--on) 32%, var(--surface)); } .g-bar.on_track .g-done { background: var(--on); }
.g-bar.delayed { background: color-mix(in srgb, var(--late) 30%, var(--surface)); } .g-bar.delayed .g-done { background: var(--late); }
.g-bar.done { background: var(--done); } .g-bar.done .g-done { background: var(--done); }
.g-bar .g-pct { position: relative; z-index: 1; font-family: var(--f-mono); font-size: 10.5px; color: #fff; padding-right: 6px; text-shadow: 0 0 2px rgba(0,0,0,.35); }
.g-bar.not_started .g-pct { color: var(--pre); text-shadow: none; }
.gantt .g-row.g-group { background: color-mix(in srgb, var(--sunken) 55%, var(--surface)); cursor: pointer; }
.gantt .g-row.g-group .g-label { background: color-mix(in srgb, var(--sunken) 55%, var(--surface)); }
.gantt .g-row.g-sub .g-label { padding-left: 24px; }
.gantt .g-row.g-sub .g-name { font-size: 12.5px; color: var(--ink2); }
.gantt .g-caret { width: 14px; flex-shrink: 0; color: var(--ink3); display: grid; place-items: center; }
.g-span { position: absolute; top: 50%; height: 10px; transform: translateY(-50%); border-radius: 5px; min-width: 4px; z-index: 1; background: var(--ink3); opacity: .7; }
.g-span.delayed { background: var(--late); } .g-span.on_track { background: var(--on); } .g-span.done { background: var(--done); } .g-span.not_started { background: var(--pre); }
.gantt-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 10px 16px; font-size: 12px; color: var(--ink3); border-top: 1px solid var(--line2); }
.gantt-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.gantt-legend .how { color: var(--ink2); }

/* ---- スマホのガント：名前（全幅）＋バー（全幅）の2段 ---- */
.gm-ctrl { display: flex; flex-direction: column; gap: 8px; }
.gm-nav { display: flex; align-items: center; gap: 8px; }
.gm-nav .rng { flex: 1; text-align: center; font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; }
.gm-nav .btn:disabled { opacity: .4; }
.gm { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.gm-axis { position: relative; margin: 0 14px; border-bottom: 1px solid var(--line2); font-family: var(--f-mono); font-size: 11px; color: var(--ink3); }
.gm-top, .gm-bot { position: relative; height: 20px; }
.gm-top span { position: absolute; top: 4px; padding-left: 4px; border-left: 1px solid var(--line); font-family: var(--f-body); font-size: 11px; font-weight: 700; color: var(--ink2); white-space: nowrap; overflow: hidden; box-sizing: border-box; }
.gm-bot .gm-t { position: absolute; top: 2px; padding-left: 3px; white-space: nowrap; overflow: hidden; box-sizing: border-box; }
.gm-todayline { position: absolute; bottom: 0; height: 20px; width: 2px; background: var(--today); }
.gantt .g-tick.td, .gm-t.td { color: var(--today); font-weight: 700; }
.gm-row { padding: 10px 14px 12px; border-top: 1px solid var(--line2); }
.gm-row:first-of-type { border-top: 0; }
.gm-row .gm-n { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; min-width: 0; }
.gm-row .gm-n a, .gm-row .gm-n b { font-weight: 700; font-size: 14px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.gm-row.lv2 .gm-n a { font-weight: 400; }
.gm-row.lv2 .gm-n { padding-left: 12px; }   /* 字下げは名前だけ（バーは時間軸の位置に合わせる） */
.gm-row .gm-d { flex-basis: 100%; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); }   /* 期間は名前の下の行に（yyyy/mm/dd で長いので横に並べない） */
.gm-track { position: relative; height: 26px; margin-top: 6px; overflow: hidden; }
.gm-track .g-bar { height: 20px; cursor: pointer; }
.gm-track .g-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line2); }
.gm-track .g-line.gl-day { background: color-mix(in srgb, var(--line2) 55%, transparent); }
.gm-track .g-line.gl-major { background: var(--line); }
.gm-grp { display: flex; flex-direction: column; gap: 5px; padding: 10px 14px 9px; background: var(--sunken); border-top: 1px solid var(--line); }
.gm-gt { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gm-gn { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; color: var(--ink); overflow-wrap: anywhere; line-height: 1.45; }
.gm-gt .btn { flex-shrink: 0; }
.gm-gm { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.gm-gt:has(.g-caret) + .gm-gm { padding-left: 22px; }
.gm-gm .mono { font-size: 11.5px; color: var(--ink3); }
.gm-grp:first-of-type { border-top: 0; }
.gm-out { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink3); background: var(--surface); padding: 0 4px; border-radius: 4px; z-index: 1; }

/* ================================================================ 小窓（PC・タブレット＝右のパネル／スマホ＝下から） */
.backdrop { position: fixed; inset: 0; background: rgba(15, 20, 25, .32); z-index: 50; }
.modal {
  position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(480px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}
.modal .m-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.modal .m-head h2 { font-size: 16px; font-family: var(--f-disp); }
.modal .m-grab { display: none; }
.modal .m-body { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; overscroll-behavior: contain; }
.modal .m-foot { display: flex; gap: 8px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line2); background: var(--surface); }
.stamp { display: flex; flex-wrap: wrap; gap: 3px 16px; margin: 0 0 14px; padding: 8px 12px; border-radius: 9px; background: var(--sunken); font-size: 12px; color: var(--ink3); }
.stamp b { font-weight: 700; color: var(--ink2); margin-right: 4px; }
.sheet-list { display: flex; flex-direction: column; gap: 6px; }
.sheet-list button, .sheet-list a { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14.5px; color: var(--ink); text-align: left; }
.sheet-list button:hover, .sheet-list a:hover { background: var(--sunken); }
.sheet-list .cur { color: var(--ink3); }
.sheet-list .cur::after { content: "いまここ"; margin-left: auto; font-size: 11.5px; }
.sheet-list svg { color: var(--ink2); }

.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 14px;
  padding: 11px 16px; border-radius: 11px; background: var(--ink); color: var(--paper); font-size: 13.5px; max-width: 460px; box-shadow: var(--shadow);
}
.toast.err { background: var(--late); color: #fff; }
.toast-act { flex-shrink: 0; min-height: 32px; padding: 0 12px; border-radius: 7px; background: transparent; border: 1px solid color-mix(in srgb, currentColor 55%, transparent); color: inherit; font-size: 13px; font-weight: 700; }

/* ================================================================ フォーム画面 */
.form-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.form-grid > .card:last-child { position: sticky; top: calc(var(--top-h) + 16px); }
/* テンプレートは1列のリスト（1行＝○ 名前／説明　使用 n）。多いときは高さを抑えた枠の中でスクロール */
.tplpick { display: flex; flex-direction: column; gap: 8px; }
.tplfind { position: relative; display: flex; align-items: center; gap: 8px; }
.tplfind svg { position: absolute; left: 11px; color: var(--ink3); pointer-events: none; }
.tplfind input { flex: 1; padding-left: 34px; }
.tplfind .count { white-space: nowrap; }
.tplcards { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.tplcards.many { max-height: min(420px, 52vh); overflow-y: auto; overscroll-behavior: contain; }
.tplcard { flex-shrink: 0; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 9px 14px; text-align: left; border: 0; border-top: 1px solid var(--line2); border-radius: 0; background: var(--surface); color: var(--ink); }
.tplcard:first-child { border-top: 0; }
.tplcard::before { content: ''; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
.tplcard:hover { background: var(--sunken); }
.tplcard.active { background: var(--accent-soft); }
.tplcard.active::before { border: 5px solid var(--accent); }
.tplcard .tx { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tplcard b { font-size: 14px; overflow-wrap: anywhere; }
.tplcard small { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tplcard i { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--ink3); white-space: nowrap; }
.tplmore { flex-shrink: 0; min-height: 44px; border: 0; border-top: 1px solid var(--line2); background: var(--surface); color: var(--accent); font-size: 13px; font-weight: 700; }
.tplmore small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.tplmore:hover { background: var(--sunken); }
.tplnone { margin: 0; padding: 14px; text-align: center; color: var(--ink3); font-size: 13px; }
.tplsel { margin-left: 8px; font-weight: 400; color: var(--accent); font-size: 12.5px; }
.autoin { position: relative; }
.autoin .auto { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11.5px; color: var(--ink3); pointer-events: none; }
.pv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--line2); font-size: 13px; }
.pv-row.l2 { padding-left: 32px; color: var(--ink2); }
.pv-row span { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); white-space: nowrap; }
.savebar { display: none; }
.setl > div { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-top: 1px solid var(--line2); }
.setl > div:first-child { border-top: 0; }
.setl .tx { flex: 1; min-width: 0; }
.setl .tx b { display: block; font-size: 13.5px; }
.setl .tx small { display: block; font-size: 12px; color: var(--ink3); }
.formula { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunken); border-radius: 9px; padding: 10px 12px; color: var(--ink2); line-height: 1.8; }
.steps { display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
.steps > div { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.steps .no { font-family: var(--f-mono); color: var(--ink3); width: 16px; }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.rules p { margin: 0 0 8px; font-size: 13.5px; }

/* ---- お知らせ ---- */
.day { font-size: 12px; color: var(--ink3); font-weight: 700; padding: 8px 16px 5px; background: var(--sunken); border-top: 1px solid var(--line2); }
.day:first-child { border-top: 0; }
.nt { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 16px; border-top: 1px solid var(--line2); align-items: start; }
.day + .nt { border-top: 0; }
.nt .u { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 7px; }
.nt .u.r { background: transparent; }
.nt .t { font-size: 13.5px; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.nt.unread .t { font-weight: 700; }
.nt .m { grid-column: 2; font-size: 12px; color: var(--ink3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nt .tm { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); }

/* ---- テンプレート編集 ---- */
.tpl-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
.tpl-list button { display: flex; flex-direction: column; width: 100%; text-align: left; padding: 11px 16px; border: 0; border-top: 1px solid var(--line2); background: none; color: var(--ink); }
.tpl-list button:first-child { border-top: 0; }
.tpl-list button:hover { background: var(--sunken); }
.tpl-list button.active { background: var(--accent-soft); }
.tpl-list button b { font-size: 13.5px; }
.tpl-list button.active b { color: var(--accent); }
.tpl-list button small { font-size: 12px; color: var(--ink3); }
.ti-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 96px 80px auto; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line2); font-size: 13px; }
.ti-row.lv2 { padding-left: 38px; }
.ti-row.head { font-size: 11.5px; color: var(--ink3); background: var(--sunken); font-weight: 700; border-top: 0; }
.ti-row .o { font-family: var(--f-mono); font-size: 12px; color: var(--ink3); text-align: right; }
.ti-row .acts, .ff-row .acts { display: flex; gap: 4px; justify-content: flex-end; }
.ff-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px 60px auto; gap: 8px; align-items: center; padding: 8px 16px; border-top: 1px solid var(--line2); font-size: 13px; }
.ff-row.head { font-size: 11.5px; color: var(--ink3); background: var(--sunken); font-weight: 700; border-top: 0; }
.ff-row .k { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink3); margin-left: 6px; }
.back { display: none; }
.tpl-detail { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ---- 設定項目の入力（1行 = 項目名・型・値） ---- */
.fe { margin: 4px 0 8px; }
.fe-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.fe-title h3 { font-size: 13.5px; }
.fe-row { display: grid; grid-template-columns: minmax(0, 1.1fr) 132px minmax(0, 1.4fr) 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
.fe-row.fe-colhead { font-size: 11.5px; font-weight: 700; color: var(--ink3); margin-bottom: 4px; }
.fe-row.tpl { background: var(--sunken); border-radius: 9px; padding: 6px 0; }
.fe-row.tpl .fe-name { padding-left: 13px; }
.fe-name { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.fe-fixed { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.fe-typename { font-weight: 400; color: var(--ink2); padding-left: 14px; font-size: 13px; }
.fe-tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--line2); color: var(--ink3); white-space: nowrap; }
.fe-tag.req { background: var(--late-bg); color: var(--late); font-weight: 700; }
.fe-opts { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; }
.fe-opts-lbl { font-size: 12px; color: var(--ink3); white-space: nowrap; padding-left: 4px; }
.fe-bad { border-color: var(--late) !important; box-shadow: 0 0 0 2px var(--late-bg); }
.fe-check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 40px; }
.fe-check input { width: 18px; height: 18px; accent-color: var(--accent); }
.fe-empty { color: var(--ink3); padding: 6px 0 10px; font-size: 13px; }

/* ================================================================ 保存中（保存が終わるまで「終わった」と見せない） */
.saving-pill { display: inline-flex; align-items: center; margin-left: 6px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--save); background: var(--save-bg); border: 1px solid var(--save-line); white-space: nowrap; vertical-align: middle; }
.is-saving { background-image: repeating-linear-gradient(-45deg, transparent 0 7px, color-mix(in srgb, var(--save-line) 22%, transparent) 7px 14px); }
.g-bar.is-saving, .g-span.is-saving { opacity: .65; outline: 2px dashed var(--save-line); outline-offset: 1px; background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .5) 0 5px, transparent 5px 10px); }
.tcard.is-saving { border-style: dashed; border-color: var(--save-line); }
.upd { font-size: 12px; color: var(--ink3); }

/* ================================================================ ドラッグ（マウス・タッチ共通） */
body.is-dragging, body.is-dragging * { -webkit-user-select: none; user-select: none; cursor: grabbing !important; }
.g-grab, .tcard { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.gantt-scroll, .board-wrap, .seg { overscroll-behavior-x: contain; }
.g-bar.g-grab { cursor: grab; }
.g-bar .g-h { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 2; }
.g-bar .g-h.l { left: 0; }
.g-bar .g-h.r { right: 0; }
.g-bar .g-h::after { content: ""; position: absolute; top: 4px; bottom: 4px; left: 3px; width: 2px; border-radius: 1px; background: rgba(255, 255, 255, .95); opacity: 0; }
.g-bar.dragging, .g-span.dragging { opacity: 1; z-index: 4; outline: 2px solid var(--accent); outline-offset: 1px; box-shadow: var(--shadow); }
.g-bar.dragging.mode-start .g-h.l::after, .g-bar.dragging.mode-end .g-h.r::after { opacity: 1; }
.g-bar.press, .g-span.press { outline: 2px solid var(--accent-soft); }
.g-span.g-grab { cursor: grab; }
.g-span.g-grab::before { content: ""; position: absolute; left: 0; right: 0; top: -9px; bottom: -9px; }
.gtip { position: fixed; z-index: 70; transform: translate(-50%, -100%); pointer-events: none; display: flex; flex-direction: column; gap: 1px; padding: 7px 12px; border-radius: 9px; background: var(--ink); color: var(--paper); font-size: 12px; white-space: nowrap; box-shadow: var(--shadow); }
.gtip b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.gtip span { opacity: .85; }
.tcard.press { transform: scale(.98); outline: 2px solid var(--accent-soft); }
.tcard.dragging { opacity: .35; border-style: dashed; }
.tcard-ghost { position: fixed; left: 0; top: 0; z-index: 70; pointer-events: none; margin: 0; box-shadow: var(--shadow); border-color: var(--accent); }

@media (hover: hover) {
  .g-bar.g-grab:hover .g-h::after { opacity: .75; }
}
@media (hover: none) {
  .icon-btn:hover, .btn:hover, .row.click:hover, .tpl-list button:hover, .alist a:hover, .sheet-list button:hover { background: inherit; }
  .btn.primary:hover { background: var(--accent); }
  .tcard:hover, .chip:hover, .sum button:hover { border-color: var(--line); }
}
@media (pointer: coarse) {
  .btn { height: 40px; } .btn.sm { height: 36px; } .btn.icon { width: 40px; } .btn.sm.icon { width: 36px; }
  .chip { height: 36px; }
  .seg button { padding: 8px 12px; }
  /* iPhone は 16px 未満の入力欄に触ると画面を拡大してしまう */
  input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea { font-size: 16px; min-height: 44px; }
  .gantt .g-row { min-height: 54px; }
  .g-bar { height: 26px; }
}

/* ================================================================
 * タブレット（1000px 以下）：左のナビはアイコンだけの細い帯
 * ================================================================ */
@media (max-width: 1000px) {
  :root { --nav-w: 68px; }
  .brand { width: auto; } .brand span { display: none; }
  .gsearch { max-width: 300px; }
  .sidebar { align-items: center; padding: 10px 6px; }
  .sidebar .group { font-size: 0; padding: 0; margin: 8px 0 4px; border-top: 1px solid var(--line2); width: 32px; }
  .sidebar .group:first-child { display: none; }
  .sidebar a { width: 56px; min-height: 48px; padding: 5px 0; flex-direction: column; justify-content: center; gap: 2px; font-size: 9.5px; letter-spacing: -.02em; text-align: center; }
  .sidebar .cnt { position: absolute; top: 2px; right: 4px; margin: 0; background: var(--late); color: #fff; border-radius: 99px; padding: 0 4px; font-size: 9px; line-height: 14px; }
  .main { padding: 18px 20px 36px; }
  .ov { grid-template-columns: minmax(0, 1fr); }
  .ov-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .form-grid > .card:last-child { position: static; }
  .gantt { min-width: 740px; --glabel: 220px; }
  .tpl-layout { grid-template-columns: 220px minmax(0, 1fr); }
  .rules { grid-template-columns: minmax(0, 1fr); }
  .modal { width: min(440px, 100vw); }
}

/* ================================================================
 * スマホ（600px 以下）：下に5つのタブ、編集は下から出す
 * ================================================================ */
@media (max-width: 600px) {
  body { font-size: 15px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px auto; }
  :root { --top-h: 52px; }
  .sidebar, .gsearch, .me span:not(.av), .desk-only { display: none !important; }
  .topbar { padding: 0 8px 0 14px; gap: 6px; }
  .savest { font-size: 11.5px; height: 28px; padding: 0 9px; }
  .savest .lg { display: none; }
  .main { padding: 14px 14px calc(var(--tab-h) + 88px + env(safe-area-inset-bottom, 0px)); gap: 14px; }
  .tabbar {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); min-height: var(--tab-h);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; color: var(--ink3); border-radius: 10px; position: relative; min-height: 54px; }
  .tabbar a.active { color: var(--accent); font-weight: 700; }
  .tabbar a.active svg { background: var(--accent-soft); border-radius: 999px; padding: 3px 12px; width: 48px; height: 28px; }
  .tabbar .cnt { position: absolute; top: 3px; left: calc(50% + 8px); background: var(--late); color: #fff; font-family: var(--f-mono); font-size: 9.5px; border-radius: 99px; padding: 0 5px; line-height: 15px; }
  .fab { display: flex; position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px)); z-index: 41; height: 52px; padding: 0 18px 0 14px; gap: 6px; align-items: center; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 700; box-shadow: var(--shadow); font-size: 14.5px; }
  .fab[hidden] { display: none; }
  .has-savebar .fab { display: none; }
  .page-head h1, .ph .ttl h1 { font-size: 21px; }
  .page-head .acts .btn.primary { display: none; }
  .sum { gap: 6px; }
  .sum button { padding: 8px 9px; }
  .sum b { font-size: 18px; }
  .sum span { font-size: 11px; }
  .mx { grid-template-columns: 1fr 1fr; }
  .mx > div:nth-child(3) { border-left: 0; }
  .mx > div:nth-child(n+3) { border-top: 1px solid var(--line2); }
  .views { flex-wrap: nowrap; }
  .views .seg { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
  .views .btn.primary { display: none; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .board { display: flex; flex-direction: column; }
  .ov-side { display: flex; }
  .ov-side .first { order: -1; }
  .modal {
    top: auto; left: 0; right: 0; bottom: 0; width: 100%; max-height: 92vh; max-height: 92dvh;
    border-left: 0; border-radius: 18px 18px 0 0;
  }
  .modal .m-grab { display: block; flex: 0 0 100%; height: 5px; margin-bottom: 4px; background: linear-gradient(var(--line), var(--line)) center / 40px 5px no-repeat; }
  .modal .m-head { padding: 8px 16px 12px; }
  .modal .m-body { padding: 14px 16px; }
  .modal .m-foot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .modal .m-foot .btn { height: 46px; }
  .modal .m-foot .btn.primary { flex: 1; }
  .stbtn button, .shift button { min-height: 46px; }
  .stp { min-height: 46px; grid-template-columns: 48px minmax(0, 1fr) 48px; }
  .rate button { height: 36px; }
  .toast { left: 12px; right: 12px; bottom: calc(var(--tab-h) + 12px + env(safe-area-inset-bottom, 0px)); max-width: none; }
  .savebar { display: flex; gap: 8px; position: fixed; left: 0; right: 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); z-index: 39; padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--line); }
  .savebar .btn { flex: 1; height: 46px; }
  .fe-row { grid-template-columns: minmax(0, 1fr) 112px 34px; row-gap: 6px; }
  .fe-row.fe-colhead { display: none; }
  .fe-row .fe-val { grid-column: 1 / -1; order: 4; }
  .fe-row .fe-opts { grid-column: 1 / -1; order: 3; }
  .fe-row.tpl { padding: 8px 10px; }
  .fe-row.tpl .fe-name { padding-left: 0; }
  .fe-typename { padding-left: 0; }
  .fe-dl { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .fe-dl dd { margin-bottom: 8px; }
  .tpl-layout { grid-template-columns: minmax(0, 1fr); }
  .tpl-layout.detail > .tpl-listcard { display: none; }
  .tpl-layout:not(.detail) > .tpl-detail { display: none; }
  .back { display: inline-flex; align-self: flex-start; }
  .ti-row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .ti-row .o { display: none; }
