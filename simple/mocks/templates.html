<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テンプレート編集｜PJ管理（簡易版）</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .cols { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .tlist button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; background: none; cursor: pointer; border-bottom: 1px solid var(--border); color: var(--text); font-size: 15px; }
  .tlist button:hover { background: var(--surface-2); }
  .tlist button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .ti-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 96px 96px 34px; gap: 8px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--border); }
  .ti-row.lv2 { padding-left: 38px; grid-template-columns: 24px minmax(0, 1fr) 96px 96px 34px; background: var(--surface-2); }
  .ti-row.head { font-size: 13px; color: var(--text-muted); font-weight: 700; background: var(--surface-2); }
  .ti-row input[type=number] { width: 100%; }
  .ff-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px 60px 34px; gap: 8px; align-items: center; padding: 7px 14px; border-bottom: 1px solid var(--border); }
  .ff-row.head { font-size: 13px; color: var(--text-muted); font-weight: 700; background: var(--surface-2); }
  @media (max-width: 700px) {
    .ti-row, .ti-row.lv2 { grid-template-columns: 24px minmax(0, 1fr) 70px 70px 30px; }
    .ff-row { grid-template-columns: minmax(0, 1fr) 90px 34px; }
    .ff-row > :nth-child(3), .ff-row > :nth-child(4) { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <div class="body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main">
      <div class="page-head">
        <div><h1>テンプレート編集</h1>
          <div class="sub">プロジェクトの型です。新しい型が増えてもコードを直さずに済むようにしています</div></div>
        <span class="spacer"></span>
        <div class="btn-row"><button class="btn primary" id="btn-save">保存</button></div>
      </div>

      <div class="cols">
        <div class="card">
          <div class="card-head"><h2>テンプレート</h2></div>
          <div class="card-body tight"><div class="tlist" id="tlist"></div></div>
        </div>

        <div>
          <div class="card" style="margin-bottom:16px">
            <div class="card-head"><h2>タスク構成</h2><span class="tag" id="ti-count">—</span>
              <span class="spacer"></span>
              <span class="small muted">日付は「開始日からの相対日数」で持ちます</span></div>
            <div class="card-body tight" id="ti"></div>
            <div class="card-head" style="border-top:1px solid var(--border);border-bottom:none">
              <button class="btn sm" id="ti-add">＋ タスクを追加</button>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h2>設定項目</h2><span class="tag" id="ff-count">—</span>
              <span class="spacer"></span>
              <span class="small muted">プロジェクト作成の画面にこの欄が出ます</span></div>
            <div class="card-body tight" id="ff"></div>
            <div class="card-head" style="border-top:1px solid var(--border);border-bottom:none">
              <button class="btn sm" id="ff-add">＋ 項目を追加</button>
            </div>
          </div>
        </div>
      </div>

      <div class="mock-note">
        <h4>この画面の検討メモ</h4>
        <ul>
          <li>対応要件: F-1-2（相対日数）／F-1-3, F-1-4（設定項目）／F-1-7（編集）</li>
          <li>テンプレートを直しても、すでに作ったプロジェクトには影響しません（F-1-9）。作成時にコピーされるためです。</li>
          <li>完全版にあった「ステータス列の定義」「種別の定義」は簡易版では持ちません。ステータス4つ・種別3つの固定です。</li>
        </ul>
      </div>
    </main>
  </div>
</div>
<script src="assets/health.js"></script>
<script src="assets/data.js"></script>
<script src="assets/ui.js"></script>
<script>
(function () {
  'use strict';
  var H = window.Health, D = window.MockData, U = window.UI;
  U.renderShell({ active: 'templates', view: 'project' });

  var cur = D.templates[0].templateId;

  function renderList() {
    document.getElementById('tlist').innerHTML = D.templates.map(function (t) {
      var n = D.templateItemsOf(t.templateId).length;
      return '<button class="' + (t.templateId === cur ? 'on' : '') + '" data-id="' + t.templateId + '">' +
        U.esc(t.name) + '<div class="small muted" style="font-weight:400">タスク ' + n + ' 件 ・ 設定項目 ' +
        D.fieldsOf(t.templateId).length + ' 件</div></button>';
    }).join('');
    document.querySelectorAll('#tlist button').forEach(function (b) {
      b.addEventListener('click', function () { cur = this.getAttribute('data-id'); renderAll(); });
    });
  }

  function renderItems() {
    var list = D.templateItemsOf(cur);
    var byParent = {};
    list.forEach(function (t) { if (t.level === 2) (byParent[t.parent] = byParent[t.parent] || []).push(t); });
    document.getElementById('ti-count').textContent = list.length + ' 件';

    function row(t, lv) {
      return '<div class="ti-row' + (lv === 2 ? ' lv2' : '') + '">' +
        '<span class="small faint" title="種別">' + H.TYPE_ICON[t.itemType] + '</span>' +
        '<input type="text" value="' + U.esc(t.name) + '" aria-label="タスク名">' +
        '<input type="number" value="' + t.startOffsetDays + '" aria-label="開始（日目）">' +
        '<input type="number" value="' + t.durationDays + '" min="1" aria-label="期間（日数）">' +
        '<button class="icon-btn" aria-label="削除" title="削除">×</button></div>';
    }

    document.getElementById('ti').innerHTML =
      '<div class="ti-row head"><span></span><span>タスク名</span><span>開始（日目）</span><span>期間（日）</span><span></span></div>' +
      list.filter(function (t) { return t.level === 1; }).map(function (t) {
        return row(t, 1) + (byParent[t.id] || []).map(function (s) { return row(s, 2); }).join('');
      }).join('');
  }

  function renderFields() {
    var list = D.fieldsOf(cur);
    document.getElementById('ff-count').textContent = list.length + ' 件';
    var TYPES = [['text', '文字'], ['number', '数値'], ['date', '日付'], ['select', '選択肢'], ['checkbox', 'はい/いいえ']];
    document.getElementById('ff').innerHTML = list.length
      ? '<div class="ff-row head"><span>表示名</span><span>型</span><span>キー</span><span>必須</span><span></span></div>' +
        list.map(function (f) {
          return '<div class="ff-row">' +
            '<input type="text" value="' + U.esc(f.label) + '" aria-label="表示名">' +
            '<select aria-label="型">' + TYPES.map(function (t) {
              return '<option value="' + t[0] + '"' + (t[0] === f.type ? ' selected' : '') + '>' + t[1] + '</option>';
            }).join('') + '</select>' +
            '<input type="text" value="' + U.esc(f.fieldKey) + '" aria-label="キー" class="small">' +
            '<input type="checkbox"' + (f.required ? ' checked' : '') + ' aria-label="必須">' +
            '<button class="icon-btn" aria-label="削除" title="削除">×</button></div>';
        }).join('') +
        (list.filter(function (f) { return f.type === 'select'; }).length
          ? '<div class="small muted" style="padding:10px 14px">選択肢の中身は、型を「選択肢」にすると別の小窓で編集します（モックでは未実装）</div>' : '')
      : '<div class="empty">設定項目がありません</div>';
  }

  function renderAll() { renderList(); renderItems(); renderFields(); }

  document.getElementById('ti-add').addEventListener('click', function () { alert('タスクを1行足します（モックでは未実装）'); });
  document.getElementById('ff-add').addEventListener('click', function () { alert('設定項目を1行足します（モックでは未実装）'); });
  document.getElementById('btn-save').addEventListener('click', function () {
    alert('保存しました（モック：再読込で元に戻ります）\n\nすでに作ったプロジェクトには反映されません');
  });

  renderAll();
})();
</script>
</body>
</html>
